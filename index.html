<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de détection</title>
<meta name="theme-color" content="#0e4194">
<meta name="description" content="Évaluation des joueurs, classements et sélection en détection de pétanque — F.F.P.J.P.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suivi détection">
<style>
:root{
  color-scheme: light;
  --page:#f4f5f2; --surface:#fcfcfb; --surface-2:#f0f1ed; --surface-3:#e6e8e2;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#7c7a74; --line:#e1e0d9; --line-2:#c9c8bf;
  --accent:#1c5cab; --accent-2:#2a78d6; --accent-soft:#e3eefb; --accent-ink:#fff;
  --s1:#2a78d6; --ref:#898781;
  --t1-bg:#e6f0fc; --t1-ink:#184f95;
  --t2-bg:#d3f0e1; --t2-ink:#0b6b45;
  --t3-bg:#fde9b8; --t3-ink:#7a4c00;
  --lo-bg:#fbe1df; --lo-ink:#9b2423;
  --hi-bg:#d9f1d9; --hi-ink:#0e5f0e;
  --warn-bg:#fff4cc; --warn-ink:#7a5600;
  --ok:#0ca30c; --bad:#d03b3b; --warn:#fab219;
  --g0:#184f95; --g1:#2a78d6; --g2:#5598e7; --g3:#9ec5f4; --g4:#d9d8d2; --g5:#f2b4b0; --g6:#e8807e; --g7:#d34b4a; --g8:#9b2423;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 4px 16px rgba(11,11,11,.05);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0f0f0e; --surface:#1a1a19; --surface-2:#222220; --surface-3:#2c2c2a;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#97958d; --line:#2c2c2a; --line-2:#44443f;
    --accent:#5598e7; --accent-2:#3987e5; --accent-soft:#1d2d44; --accent-ink:#0b0b0b;
    --s1:#3987e5; --ref:#898781;
    --t1-bg:#1b2c45; --t1-ink:#9ec5f4;
    --t2-bg:#143a2a; --t2-ink:#7fdcb0;
    --t3-bg:#45350f; --t3-ink:#f7cd6b;
    --lo-bg:#4a1d1c; --lo-ink:#f2a7a5;
    --hi-bg:#163d16; --hi-ink:#8fe08f;
    --warn-bg:#40330c; --warn-ink:#f7d36b;
    --g0:#9ec5f4; --g1:#5598e7; --g2:#2a78d6; --g3:#1c5cab; --g4:#4a4a46; --g5:#8a3434; --g6:#b44848; --g7:#e06464; --g8:#f2a7a5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0f0f0e; --surface:#1a1a19; --surface-2:#222220; --surface-3:#2c2c2a;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#97958d; --line:#2c2c2a; --line-2:#44443f;
    --accent:#5598e7; --accent-2:#3987e5; --accent-soft:#1d2d44; --accent-ink:#0b0b0b;
    --s1:#3987e5; --ref:#898781;
    --t1-bg:#1b2c45; --t1-ink:#9ec5f4;
    --t2-bg:#143a2a; --t2-ink:#7fdcb0;
    --t3-bg:#45350f; --t3-ink:#f7cd6b;
    --lo-bg:#4a1d1c; --lo-ink:#f2a7a5;
    --hi-bg:#163d16; --hi-ink:#8fe08f;
    --warn-bg:#40330c; --warn-ink:#f7d36b;
    --g0:#9ec5f4; --g1:#5598e7; --g2:#2a78d6; --g3:#1c5cab; --g4:#4a4a46; --g5:#8a3434; --g6:#b44848; --g7:#e06464; --g8:#f2a7a5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-logo{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8dde3 0,#9aa3ad 35%,#5b636c 70%,#3b4148 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);position:relative;flex:none}
.brand-logo::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);border-left-color:transparent;border-right-color:transparent}
.brand b{display:block;font-size:15px;letter-spacing:.2px}
.brand span{display:block;font-size:12px;color:var(--muted)}
.nav-sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;cursor:pointer;user-select:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:12px 8px 0;display:flex;gap:6px;flex-wrap:wrap}
/* Main */
.main{min-width:0;padding:22px 28px 60px}
.topbar{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.topbar h1{font-size:22px;margin:0;letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:15px}
.card-h .hint{color:var(--muted);font-size:12px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line-2)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.part{background:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.inp:focus,.cell:focus{outline:2px solid var(--accent-2);outline-offset:-1px;border-color:transparent}
.search{max-width:240px}
/* Tables */
.tw{overflow:auto;max-width:100%;border-radius:0 0 var(--radius) var(--radius)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.t th,.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.t th{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);position:sticky;top:0;z-index:2}
.t thead tr:nth-child(2) th{top:29px}
.t th.grp{text-align:center;color:var(--ink);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-left:1px solid var(--line)}
.t .l{text-align:left}
.t .c{text-align:center}
.t .bl{border-left:1px solid var(--line)}
.t tbody tr:hover td{background:var(--surface-2)}
.t td.name{text-align:left;font-weight:600;position:sticky;left:0;background:var(--surface);z-index:1;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.t th.name{text-align:left;position:sticky;left:0;z-index:3}
.t tbody tr:hover td.name{background:var(--surface-2)}
.t th.sort{cursor:pointer}
.t th.sort:hover{color:var(--accent)}
.t th.sorted{color:var(--accent)}
.t tr.dim td{opacity:.45}
.t tr.dim td.name{opacity:.6}
.t tfoot td{font-weight:600;background:var(--surface-2);position:sticky;bottom:0}
.namebtn{all:unset;cursor:pointer}
.namebtn:hover{color:var(--accent);text-decoration:underline}
.rk{display:inline-grid;place-items:center;min-width:24px;height:22px;border-radius:6px;background:var(--surface-3);font-size:12px;font-weight:700;padding:0 4px}
.rk.r1{background:#f5c542;color:#3b2a00}.rk.r2{background:#cfd6de;color:#1f2933}.rk.r3{background:#d9a273;color:#3a1d05}
.pbadge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);min-width:26px;text-align:center}
.pbadge.P{background:#e3eefb;color:#184f95}.pbadge.M{background:#ece8fb;color:#4a3aa7}.pbadge.T{background:#fde5da;color:#9a3d14}
:root[data-theme="dark"] .pbadge.P{background:#1b2c45;color:#9ec5f4}:root[data-theme="dark"] .pbadge.M{background:#2a2550;color:#b9b0f2}:root[data-theme="dark"] .pbadge.T{background:#46261a;color:#f3b294}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pbadge.P{background:#1b2c45;color:#9ec5f4}:root:not([data-theme="light"]) .pbadge.M{background:#2a2550;color:#b9b0f2}:root:not([data-theme="light"]) .pbadge.T{background:#46261a;color:#f3b294}}
.tier{border-radius:6px;padding:2px 6px;display:inline-block;min-width:46px}
.tier1{background:var(--t1-bg);color:var(--t1-ink)}
.tier2{background:var(--t2-bg);color:var(--t2-ink);font-weight:600}
.tier3{background:var(--t3-bg);color:var(--t3-ink);font-weight:700}
.tier3::after{content:" ★";font-size:10px}
.lo{background:var(--lo-bg);color:var(--lo-ink)}
.hi{background:var(--hi-bg);color:var(--hi-ink);font-weight:600}
.warnc{background:var(--warn-bg)!important;color:var(--warn-ink)}
.muted{color:var(--muted)}
.small{font-size:12px}
.neg{color:var(--bad)}
/* entry cells */
.cell{width:38px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 0;background:var(--surface);font-variant-numeric:tabular-nums}
.cell:not(:placeholder-shown){background:var(--accent-soft);border-color:transparent;font-weight:600}
.cell.z{background:var(--surface)!important;font-weight:400;color:var(--muted)}
.cell.w{width:30px}
.ent td{padding:3px 3px}
.ent th{padding:5px 3px}
.ent th.gh{font-size:13px;color:var(--ink)}
.ent th.gh small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.stat{padding:6px 8px!important}
.ok-i{color:var(--ok);font-weight:700}
.bad-i{color:var(--bad);font-weight:700}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:13px}
.alert.ok{background:var(--hi-bg);color:var(--hi-ink)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.thr{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.thr b{color:var(--ink);font-variant-numeric:tabular-nums}
/* status buttons */
.st{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.st button{border:0;background:var(--surface);padding:4px 8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.st button+button{border-left:1px solid var(--line-2)}
.st button.on.R{background:var(--ok);color:#fff}
.st button.on.S{background:var(--warn);color:#3b2a00}
.st button.on.X{background:var(--surface-3);color:var(--ink)}
.quota{display:flex;gap:12px;flex-wrap:wrap}
.quota .q{flex:1;min-width:170px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.quota .q b{font-size:20px}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--accent-2);border-radius:3px}
.score{display:inline-flex;align-items:center;gap:6px;min-width:96px}
.score .bar{width:52px;margin:0}
/* charts */
.chart{width:100%;display:block}
.chart text{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chart .grid line{stroke:var(--line)}
.chart .axis{stroke:var(--line-2)}
.distbar{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface)}
.distbar span{display:block;height:100%;min-width:0}
.distrow{display:grid;grid-template-columns:90px 1fr 54px;gap:10px;align-items:center;margin:6px 0;font-size:12px}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.35;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .08s}
.tip.show{opacity:1}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;max-width:980px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:19px}
.modal-b{padding:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:200;opacity:0;transition:all .2s;font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
details.help{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface)}
details.help summary{cursor:pointer;font-weight:600}
details.help p,details.help li{color:var(--ink-2);font-size:13px}
code{background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:12px}
.mobile-nav{display:none}
.brand-v{flex-direction:column;text-align:center;gap:8px}
.brand-img{width:92px;height:auto;flex:none;background:#fff;border-radius:8px;padding:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.printonly{display:none}
kbd{font:600 11px system-ui;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-nav{display:flex;gap:6px;overflow:auto;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .mobile-nav a{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;cursor:pointer;color:var(--ink-2)}
  .mobile-nav a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .main{padding:16px}
  .g2,.g4{grid-template-columns:1fr}
}
@media print{
  .printonly{display:inline!important}
  .rapport + .rapport{break-before:page}
  .side,.mobile-nav,.actions,.noprint,.btn,.seg,.chips,.st{display:none!important}
  .app{display:block}.main{padding:0}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
  .tw{overflow:visible}
  .t th{position:static}
  .t td.name{position:static}
  .modal-bg{position:static;background:none;padding:0}
  .modal{box-shadow:none}
}
/* Menu aux couleurs de la FFPJP (bleu #0e4194, rouge #e30613) et logo en blanc */
.side{background:#0e4194;border-right:0;color:#fff}
.side .brand b{color:#fff}
.side .brand-img{background:none;box-shadow:none;padding:0;filter:brightness(0) invert(1)}
.side .nav-sec{color:rgba(255,255,255,.62)}
.side .nav a{color:rgba(255,255,255,.9)}
.side .nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.side .nav a.on{background:#fff;color:#0e4194;box-shadow:inset 4px 0 0 #e30613}
.side .nav .cnt,.side .muted{color:rgba(255,255,255,.7)}
.side .nav a.on .cnt{color:#0e4194}
.side .btn.ghost{color:#fff}
.side .btn.ghost:hover{background:rgba(255,255,255,.12)}
@media (max-width:860px){
  .mobile-nav{background:#0e4194;border-bottom:3px solid #e30613}
  .mobile-nav a{color:#fff;border-color:rgba(255,255,255,.35)}
  .mobile-nav a.on{background:#fff;color:#0e4194;border-color:#fff}
}
.alert:has(.errlist){flex-wrap:wrap}
.errlist{flex-basis:100%}
.t tr.flashrow td{background:var(--warn-bg)!important;transition:background .3s}
/* Impression de la fiche joueur : seule la fiche est imprimée (pas la page en dessous) */
@media print{
  body:has(#modal .modal-bg) .app{display:none!important}
  .modal .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal .grid.g3,.niveauBox .grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .modal .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rapport{break-inside:auto}
  .rapport .card-h{break-after:avoid}
  .rapport .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rapport .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rapport .tw .t{font-size:11px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div style="min-width:0">
    <nav class="mobile-nav" id="mnav"></nav>

","86":"NOUVELLE AQUITAINE","87":"NOUVELLE AQUITAINE","88":"GRAND EST","89":"BOURGOGNE FRANCHE COMTÉ","90":"BOURGOGNE FRANCHE COMTÉ","91":"ILE DE FRANCE","92":"ILE DE FRANCE","93":"ILE DE FRANCE","94":"ILE DE FRANCE","95":"ILE DE FRANCE","971":"ANTILLES GUYANE","972":"ANTILLES GUYANE","973":"ANTILLES GUYANE","974":"LA RÉUNION","976":"MAYOTTE"};
const ligueOf = cd => { if(!cd) return ''; let k=String(cd).trim().toUpperCase(); if(/^0\d$/.test(k)) k=k.slice(1); return LIGUES[k]||''; };

const domaineAuto = p => (p==='P'||p==='PM') ? 'point' : (p==='T'||p==='TM') ? 'tir' : 'total';

/* ---------- État ---------- */
const STORE_KEY = 'suivi-detection-v1';
const MAXP = 999;
/* ---------- Sessions (ateliers, combiné, tir de précision) ----------
   Chaque épreuve peut avoir plusieurs sessions, rattachées à un regroupement.

const SESS_KINDS = ['ateliers','combine','tdp'];
const SESS_LABEL = {ateliers:'Ateliers', combine:'Combiné', tdp:'Tir de précision'};
function sid(){ return Math.random().toString(36).slice(2,9); }
function newSess(n, g){ return {id:sid(), nom:'Session '+n, date:'', g:g||'g1', data:{}}; }
function curSess(s, kind){ const L=s.sessions[kind]; let id=null; try{ id=UI.sess[kind]; }catch(e){} return L.find(x=>x.id===id)||L[0]; }
function linkSessions(s){

    get(){ return curSess(this,kind).data; }, set(v){ curSess(this,kind).data = (v&&typeof v==='object')?v:{}; }}));

}
function defaultState(){
  return linkSessions({
    meta:{titre:'Détection', categorie:'', lieu:'', date:'', educateur:''},
    cfg:{
      nbParties:5,

    },

    sessions:{ateliers:[newSess(1)], combine:[newSess(1)], tdp:[newSess(1)]},
    sel:{}, notes:{}
  });
}
let S = load();
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ return merge(defaultState(), JSON.parse(raw)); } }catch(e){}
  return defaultState();
}
function merge(base, o){
  if(!o || typeof o!=='object') return base;
  for(const k of Object.keys(o)){
    if(base[k] && typeof base[k]==='object' && !Array.isArray(base[k]) && o[k] && typeof o[k]==='object' && !Array.isArray(o[k])) base[k]=merge(base[k],o[k]);
    else base[k]=o[k];
  }
  if(Array.isArray(base.parties)){
    while(base.parties.length<MAXP) base.parties.push({nom:'Partie '+(base.parties.length+1),date:'',bj:12,s:{}});
    // Regroupements : au moins un, et chaque partie rattachée à un regroupement existant
    if(!Array.isArray(base.groupes) || !base.groupes.length) base.groupes=[{id:'g1', nom:'Regroupement 1', date:''}];
    const ids=base.groupes.map(g=>g.id);
    base.parties.forEach((p,i)=>{ if(!ids.includes(p.g)){ const prev=i>0?base.parties[i-1].g:null; p.g = ids.includes(prev)?prev:ids[0]; } });
    if(!base.sessions || typeof base.sessions!=='object') base.sessions={};
    SESS_KINDS.forEach(k=>{ if(!Array.isArray(base.sessions[k]) || !base.sessions[k].length) base.sessions[k]=[newSess(1, ids[0])]; base.sessions[k].forEach(x=>{ if(!x.id) x.id=sid(); if(!ids.includes(x.g)) x.g=ids[0]; if(!x.data||typeof x.data!=='object') x.data={}; }); });
  }
  return base;
}
let saveT=null, lastSave=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); lastSave=new Date(); const el=document.getElementById('saved'); if(el) el.textContent='Enregistré '+lastSave.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }catch(e){} },250); }
const uid = () => Math.random().toString(36).slice(2,9);

/* ---------- Utilitaires ---------- */
const sum = a => a.reduce((x,y)=>x+(+y||0),0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1 = v => (v==null||isNaN(v)) ? '–' : (Math.round(v*10)/10).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const f0 = v => (v==null||isNaN(v)) ? '–' : Math.round(v).toLocaleString('fr-FR');
const zeros = n => Array(n).fill(0);
const activeParties = () => S.parties.slice(0, S.cfg.nbParties).map((p,i)=>({...p, idx:i}));
/* Parties retenues pour les analyses : toutes, ou celles du regroupement filtré */
const grpFiltre = () => (typeof UI!=='undefined' && UI.grp && UI.grp!=='all' && S.groupes.some(g=>g.id===UI.grp)) ? UI.grp : null;
const analysisParties = () => { const g=grpFiltre(); return activeParties().filter(p=>!g||p.g===g); };
const groupeById = id => S.groupes.find(g=>g.id===id);
const playerById = id => S.players.find(p=>p.id===id);
const sortedPlayers = () => [...S.players].sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));

/* =====================================================================
   CALCULS — reproduction exacte des formules Excel
   ===================================================================== */

/* Feuilles P1…P15 et « Parties » (colonnes Y→AJ)
   Intensité point = (+,A,B,C + 0,5×D) / BJ ×100
   Intensité tir   = (+,A,B,C + 0,5×(D+E)) / BJ ×100
   Volume          = Σ(poids × nb) / BJ ×100   (poids +2 … −2)
   Efficacité      = moyenne(Intensité, Volume)
   Total           = moyennes pondérées par les boules jouées              */
function calcPartie(p, t){
  p = p||zeros(9); t = t||zeros(9);
  const nP = sum(p), nT = sum(t), n = nP+nT;
  const IP = nP ? (p[0]+p[1]+p[2]+p[3]+0.5*p[4])/nP*100 : 0;
  const VP = nP ? p.reduce((s,c,i)=>s+W_PARTIE[i]*(+c||0),0)/nP*100 : 0;
  const IT = nT ? (t[0]+t[1]+t[2]+t[3]+0.5*(t[4]+t[5]))/nT*100 : 0;
  const VT = nT ? t.reduce((s,c,i)=>s+W_PARTIE[i]*(+c||0),0)/nT*100 : 0;
  const I = n ? (nP*IP+nT*IT)/n : 0, V = n ? (nP*VP+nT*VT)/n : 0;
  return {
    point:{n:nP, I:IP, V:VP, E:nP?(IP+VP)/2:0},
    tir:{n:nT, I:IT, V:VT, E:nT?(IT+VT)/2:0},
    total:{n, I, V, E:n?(I+V)/2:0}
  };
}
const getPS = (pi, pid) => S.parties[pi].s[pid] || {p:zeros(9), t:zeros(9)};
function cumulParties(pid){
  const p=zeros(9), t=zeros(9); let nb=0;
  analysisParties().forEach(pa=>{ const r=pa.s[pid]; if(r){ const k=sum(r.p)+sum(r.t); if(k) nb++; r.p.forEach((v,i)=>p[i]+=+v||0); r.t.forEach((v,i)=>t[i]+=+v||0);} });
  return {p,t,nb};
}
const expectedParties = () => 0; // nombre de boules à jouer par partie supprimé : pas de contrôle
/* Sessions retenues pour les analyses (filtre regroupement) et cumul par joueur */
const analysisSessions = kind => { const g=grpFiltre(); return S.sessions[kind].filter(x=>!g||x.g===g); };
function avgResults(list){ // moyenne champ par champ de résultats de même forme
  const f=(vals)=> typeof vals[0]==='number' ? sum(vals)/vals.length : Array.isArray(vals[0]) ? vals[0].map((_,i)=>f(vals.map(v=>v[i]))) : Object.fromEntries(Object.keys(vals[0]).map(k=>[k,f(vals.map(v=>v[k]))]));
  return f(list);
}
function cumulAteliers(pid){
  const p=zeros(5), t=zeros(4); let ns=0;
  analysisSessions('ateliers').forEach(x=>{ const a=x.data[pid]; if(a && (sum(a.p)+sum(a.t))){ ns++; a.p.forEach((v,i)=>p[i]+=+v||0); a.t.forEach((v,i)=>t[i]+=+v||0); } });
  const A=calcAtelier({p,t}); A.ns=ns;
  if(ns>1) ['point','tir','total'].forEach(d=>A[d].pts=A[d].pts/ns); // points : moyenne par session
  A.cnt={p,t}; return A;
}
function cumulMulti(kind, pid){ // combiné / tir de précision : moyenne des sessions passées
  const calc = kind==='combine'?calcCombine:calcTdp;
  const res=analysisSessions(kind).map(x=>x.data[pid]).filter(Boolean).map(calc).filter(r=>r.bj);
  if(!res.length) return Object.assign(calc(null),{ns:0});
  if(res.length===1) return Object.assign(res[0],{ns:1});
  const m=avgResults(res); m.bj=sum(res.map(r=>r.bj)); m.ns=res.length; return m;
}

/* Feuille « Ateliers »
   Point : notes −1,0,1,3,5  → pts = −1×n(−1) + 1×n(1) + 3×n(3) + 5×n(5)
           Intensité = (n3+n5 + 0,75×n1)/BJ ; Volume poids −1,−1,0,1,1,5
   Tir   : notes 0,1,3,5     → pts = −1×n(0) + n(1) + 3×n(3) + 5×n(5)
           Intensité = (n1+n3+n5)/BJ ; Volume poids −1,0,1,1,5 */
function calcAtelier(a){
  const p = (a&&a.p)||zeros(5), t=(a&&a.t)||zeros(4);
  const nP=sum(p), nT=sum(t), n=nP+nT;
  const ptsP = -p[0] + p[2] + 3*p[3] + 5*p[4];
  const ptsT = -t[0] + t[1] + 3*t[2] + 5*t[3];
  const IP = nP ? (p[3]+p[4]+0.75*p[2])/nP*100 : 0;
  const VP = nP ? p.reduce((s,c,i)=>s+VOL_AT_P[i]*(+c||0),0)/nP*100 : 0;
  const IT = nT ? (t[1]+t[2]+t[3])/nT*100 : 0;
  const VT = nT ? t.reduce((s,c,i)=>s+VOL_AT_T[i]*(+c||0),0)/nT*100 : 0;
  const I = n?(nP*IP+nT*IT)/n:0, V=n?(nP*VP+nT*VT)/n:0;
  return {
    point:{n:nP, pts:ptsP, I:IP, V:VP, E:nP?(IP+VP)/2:0},
    tir:{n:nT, pts:ptsT, I:IT, V:VT, E:nT?(IT+VT)/2:0},
    total:{n, pts:ptsP+ptsT, I, V, E:n?(I+V)/2:0}
  };
}

/* Feuilles « Combine » / « Resultats Combine »
   4 séquences (6 m, 8 m, 6 m, 8 m) × (3 boules point + 3 boules tir), notes 0/1/2.
   Séquence : pts/12, réussite = boules >0 / 6. Point & tir : pts/24. Total : pts/48. */
function calcCombine(c){
  const p=(c&&c.p)||Array(12).fill(null), t=(c&&c.t)||Array(12).fill(null);
  const all=[...p,...t], bj=all.filter(v=>v!=null&&v!=='').length;
  const seq=[0,1,2,3].map(k=>{ const b=[...p.slice(k*3,k*3+3),...t.slice(k*3,k*3+3)]; const pts=sum(b); return {pts, pct:pts/12*100, reu:b.filter(v=>+v>0).length/6*100}; });
  const ptsP=sum(p), ptsT=sum(t), pts=ptsP+ptsT;
  return {bj, seq,
    point:{pts:ptsP, pct:ptsP/24*100, reu:p.filter(v=>+v>0).length/12*100},
    tir:{pts:ptsT, pct:ptsT/24*100, reu:t.filter(v=>+v>0).length/12*100},
    total:{pts, pct:pts/48*100, reu:all.filter(v=>+v>0).length/24*100}};
}

/* Feuilles « Tir de Precision » / « Resultats TdP »
   5 ateliers × 4 distances (6-7-8-9 m), 1 boule notée 0/1/3/5.
   Distance : pts/25 ; Atelier : pts/20 ; Total : pts (sur 100) ; réussite = boules >0. */
function calcTdp(arr){
  const a = arr||Array(20).fill(null);
  const v=(i)=>+a[i]||0, has=(i)=>a[i]!=null&&a[i]!=='';
  const bj=a.filter((x,i)=>has(i)).length;
  const dist=[0,1,2,3].map(d=>{ const idx=[0,1,2,3,4].map(k=>k*4+d); const pts=sum(idx.map(v)); return {pts,pct:pts/25*100,reu:idx.filter(i=>v(i)>0).length/5*100}; });
  const at=[0,1,2,3,4].map(k=>{ const idx=[0,1,2,3].map(d=>k*4+d); const pts=sum(idx.map(v)); return {pts,pct:pts/20*100,reu:idx.filter(i=>v(i)>0).length/4*100}; });
  const pts=sum(a.map((x,i)=>v(i)));
  return {bj, dist, at, total:{pts, pct:pts, reu:a.filter((x,i)=>v(i)>0).length/20*100}};
}

/* Seuils des feuilles « Classement » (colonnes AM→AW)
   Moyenne = moyenne du groupe pondérée par les boules jouées
   Seuil 1 = moyenne pondérée des joueurs au-dessus de la moyenne
   Seuil 2 = moyenne pondérée des joueurs au-dessus du seuil 1          */
function seuils(items, moy){
  const wm = (lim)=>{ const f=items.filter(x=>x.w>0&&x.v>lim); const w=sum(f.map(x=>x.w)); return w? sum(f.map(x=>x.v*x.w))/w : null; };
  const s1 = wm(moy); const s2 = s1==null?null:wm(s1);
  return {moy, s1, s2};
}
const tierOf = (v,th) => (th.s2!=null&&v>th.s2)?3:(th.s1!=null&&v>th.s1)?2:(v>th.moy)?1:0;

/* ---------- Agrégats de groupe ---------- */
function computeAll(){
  const parts = analysisParties();
  const rows = S.players.map(pl=>{
    const cu = cumulParties(pl.id);
    const P = calcPartie(cu.p, cu.t);
    const A = cumulAteliers(pl.id);
    const C = cumulMulti('combine', pl.id);
    const T = cumulMulti('tdp', pl.id);
    const perGame = parts.map(pa=>{ const r=pa.s[pl.id]; return r ? calcPartie(r.p,r.t) : null; });
    const dom = domaineAuto(pl.poste);
    return {pl, cu, P, A, C, T, perGame, dom, fam:famille(pl.poste)};
  });
  // moyennes de groupe = calcul sur les comptes cumulés (équivalent à la moyenne pondérée Excel)
  const gp=zeros(9), gt=zeros(9), ap=zeros(5), at=zeros(4);
  rows.forEach(r=>{ r.cu.p.forEach((v,i)=>gp[i]+=v); r.cu.t.forEach((v,i)=>gt[i]+=v); const a=r.A.cnt; a.p.forEach((v,i)=>ap[i]+=+v||0); a.t.forEach((v,i)=>at[i]+=+v||0); });
  const GP = calcPartie(gp,gt), GA = calcAtelier({p:ap,t:at});
  const th = {parties:{}, ateliers:{}};
  ['point','tir','total'].forEach(d=>{
    th.parties[d]={}; th.ateliers[d]={};
    ['I','V','E'].forEach(m=>{
      th.parties[d][m] = seuils(rows.map(r=>({v:r.P[d][m], w:r.P[d].n})), GP[d][m]);
      th.ateliers[d][m] = seuils(rows.map(r=>({v:r.A[d][m], w:r.A[d].n})), GA[d][m]);
    });
    const pm = rows.filter(r=>r.A[d].n).map(r=>r.A[d].pts);
    const mp = pm.length? sum(pm)/pm.length : 0;
    th.ateliers[d].pts = seuils(rows.map(r=>({v:r.A[d].pts, w:r.A[d].n?1:0})), mp);
  });
  // moyennes par partie (feuilles Intensité/Volume/Efficacité ligne 6)
  const gameMeans = parts.map(pa=>{ const p=zeros(9),t=zeros(9); Object.values(pa.s).forEach(r=>{r.p.forEach((v,i)=>p[i]+=+v||0); r.t.forEach((v,i)=>t[i]+=+v||0);}); return calcPartie(p,t); });
  return {rows, GP, GA, th, gp, gt, ap, at, gameMeans, parts};
}

/* ---------- Contrôles de saisie (messages « La saisie des résultats est juste ») ---------- */
function partieStatus(pi){
  const pa=S.parties[pi], exp=0; let filled=0, bad=0;
  S.players.forEach(pl=>{ const r=pa.s[pl.id]; const n=r?sum(r.p)+sum(r.t):0; if(n){filled++; if(exp && n!==exp) bad++;} });
  return {filled, bad, state: !filled?'empty': bad?'bad': filled<S.players.length?'part':'ok'};
}
function moduleStatus(kind, data){
  let filled=0,bad=0; const D=data||S[kind];
  S.players.forEach(pl=>{
    let n=0, ok=true;
    if(kind==='ateliers'){ const a=D[pl.id]; if(a){ const np=sum(a.p), nt=sum(a.t); n=np+nt; ok=(np===S.cfg.bjAtPoint||!S.cfg.bjAtPoint)&&(nt===S.cfg.bjAtTir||!S.cfg.bjAtTir);} }
    if(kind==='combine'){ n=calcCombine(D[pl.id]).bj; ok=n===S.cfg.bjCombine; }
    if(kind==='tdp'){ n=calcTdp(D[pl.id]).bj; ok=n===S.cfg.bjTdp; }
    if(n){filled++; if(!ok) bad++;}
  });
  return {filled,bad,state:!filled?'empty':bad?'bad':filled<S.players.length?'part':'ok'};
}

/* =====================================================================
   SÉLECTION — score composite (nouveauté par rapport au classeur)
   Chaque critère est ramené sur 0–100 (rang centile ou min–max),
   au sein de la famille de poste si demandé, puis pondéré.
   ===================================================================== */
function computeSelection(all){
  const cfg=S.cfg, W=cfg.poids;
  const crit = [
    {k:'parties', label:'Parties', get:r=> r.P[r.dom].n ? r.P[r.dom].E : null},
    {k:'ateliers', label:'Ateliers', get:r=> r.A[r.dom].n ? r.A[r.dom].E : null},
    {k:'combine', label:'Combiné', get:r=> r.C.bj ? r.C.total.pct : null},
    {k:'tdp', label:'Tir de précision', get:r=> r.T.bj ? r.T.total.pct : null}
  ];
  const groups = {};
  all.rows.forEach(r=>{ const g = cfg.parFamille ? (r.fam||'?') : 'all'; (groups[g]=groups[g]||[]).push(r); });
  const out = new Map();
  all.rows.forEach(r=>out.set(r.pl.id,{raw:{},norm:{},score:0,missing:[]}));
  Object.values(groups).forEach(list=>{
    crit.forEach(c=>{
      const vals = list.map(r=>({r, v:c.get(r)})).filter(x=>x.v!=null);
      const n=vals.length;
      if(cfg.norm==='rang'){
        const sorted=[...vals].sort((a,b)=>b.v-a.v);
        vals.forEach(x=>{
          const better=sorted.filter(y=>y.v>x.v).length, equal=sorted.filter(y=>y.v===x.v).length;
          const rank=better+(equal+1)/2; // rang moyen en cas d'égalité
          out.get(x.r.pl.id).norm[c.k] = n<=1 ? 100 : (n-rank)/(n-1)*100;
        });
      } else {
        const mn=Math.min(...vals.map(x=>x.v)), mx=Math.max(...vals.map(x=>x.v));
        vals.forEach(x=>{ out.get(x.r.pl.id).norm[c.k] = mx===mn ? 100 : (x.v-mn)/(mx-mn)*100; });
      }
      list.forEach(r=>{ const o=out.get(r.pl.id); o.raw[c.k]=c.get(r); if(o.raw[c.k]==null && W[c.k]>0) o.missing.push(c.label); });
    });
  });
  out.forEach(o=>{
    let num=0, den=0;
    crit.forEach(c=>{ const w=+W[c.k]||0; if(!w) return; if(o.norm[c.k]==null){ if(cfg.manquant==='zero') den+=w; } else { num+=w*o.norm[c.k]; den+=w; } });
    o.score = den ? num/den : 0;
  });
  // rangs par famille
  const byFam={};
  all.rows.forEach(r=>{ (byFam[r.fam]=byFam[r.fam]||[]).push(r.pl.id); });
  Object.values(byFam).forEach(ids=>{ ids.sort((a,b)=>out.get(b).score-out.get(a).score).forEach((id,i)=>out.get(id).rangFam=i+1); });
  return {out, crit};
}

function nav(){
  const counts = {joueurs:S.players.length};
  document.getElementById('side').innerHTML = `
    <div class="brand brand-v"><img class="brand-img" src="${LOGO_FFPJP}" alt="FFPJP"><b>Suivi de détection F.F.P.J.P.</b></div>
    <div class="nav">${VIEWS.map(v=>v.sec?`<div class="nav-sec">${v.sec}</div>`:`<a class="${VIEW===v.id?'on':''}" data-nav="${v.id}">${ICONS[v.id]}${v.label}${counts[v.id]!=null?`<span class="cnt">${counts[v.id]}</span>`:''}</a>`).join('')}</div>
    <div class="side-foot"><button class="btn sm ghost" data-act="theme" title="Changer de thème">${ICONS.moon}Thème</button><span class="small muted" id="saved" style="align-self:center"></span></div>`;
  document.getElementById('mnav').innerHTML = VIEWS.filter(v=>v.id).map(v=>`<a class="${VIEW===v.id?'on':''}" data-nav="${v.id}">${v.label}</a>`).join('');
}
function go(v){ VIEW=v; UI.view=v; saveUI(); render(); window.scrollTo(0,0); }
function render(){
  nav();
  const fn = {dash:vDash, joueurs:vJoueurs, parties:vParties, ateliers:vAteliers, combine:vCombine, tdp:vTdp, classements:vClassements, regularite:vRegularite, selection:vSelection, rapports:vRapports, params:vParams}[VIEW] || vDash;
  document.getElementById('main').innerHTML = fn();
  afterRender();
}
let afterHooks=[];
function afterRender(){ const h=afterHooks; afterHooks=[]; h.forEach(f=>f()); }

/* Filtre « Regroupement » des analyses (affiché seulement s'il y a plusieurs regroupements) */
function grpSelect(){
  if(S.groupes.length<2) return '';
  const g=grpFiltre()||'all';
  return `<select class="inp" data-grpf style="width:auto;min-width:200px" data-tip="Parties prises en compte dans les calculs"><option value="all" ${g==='all'?'selected':''}>Tous les regroupements</option>${S.groupes.map(x=>`<option value="${x.id}" ${g===x.id?'selected':''}>${esc(x.nom)}${x.date?' · '+esc(new Date(x.date).toLocaleDateString('fr-FR')):''}</option>`).join('')}</select>`;
}
const grpLabel = () => { const g=grpFiltre(); return g ? ' · '+esc(groupeById(g).nom) : ''; };
function header(title, sub, actions=''){
  return `<div class="topbar"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="actions">${actions}</div></div>`;
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function openModal(html){ document.getElementById('modal').innerHTML=`<div class="modal-bg" data-act="closemodal"><div class="modal">${html}</div></div>`; document.body.style.overflow='hidden'; }
function closeModal(){ document.getElementById('modal').innerHTML=''; document.body.style.overflow=''; }
const pbadge = p => p ? `<span class="pbadge ${famille(p)}" data-tip="${esc(POSTES[p]||p)}">${esc(p)}</span>` : '<span class="pbadge">?</span>';
const nameBtn = pl => `<button class="namebtn" data-act="fiche" data-id="${pl.id}">${esc(pl.nom)}</button>`;
function tierCell(v, th, extra='', fmt=f1){ if(v==null) return `<td class="${extra}">–</td>`; const t=tierOf(v,th); return `<td class="${extra}"><span class="tier ${t?'tier'+t:''}" data-tip="${tipTier(t,th)}">${fmt(v)}</span></td>`; }
function tipTier(t, th){ const L=['Sous la moyenne','Au-dessus de la moyenne','Au-dessus du seuil 1','Au-dessus du seuil 2 (élite)']; return esc(`${L[t]} — moy. ${f1(th.moy)} · S1 ${f1(th.s1)} · S2 ${f1(th.s2)}`); }
const legendTiers = () => `<div class="legend"><span><i class="tier1" style="background:var(--t1-bg)"></i>&gt; moyenne</span><span><i style="background:var(--t2-bg)"></i>&gt; seuil 1</span><span><i style="background:var(--t3-bg)"></i>&gt; seuil 2 ★</span><span class="muted">Seuil 1 = moyenne des joueurs au-dessus de la moyenne · Seuil 2 = moyenne des joueurs au-dessus du seuil 1 (pondérées par les boules jouées)</span></div>`;
function statusDot(st){ const m={ok:['ok','Saisie complète et conforme'],bad:['bad','Écart entre boules jouées et boules à jouer'],part:['part','Saisie partielle'],empty:['','Aucune saisie']}[st.state]; return `<span class="dot ${m[0]}" data-tip="${m[1]}"></span>`; }
function emptyPlayers(){ return `<div class="card"><div class="empty"><b>Aucun joueur inscrit</b>Commencez par inscrire les joueurs de la détection.<br><br><button class="btn pri" data-nav="joueurs">${ICONS.plus}Inscrire des joueurs</button> <button class="btn" data-act="demo">Charger un exemple</button></div></div>`; }

/* ---------- Tooltip ---------- */
const tipEl = document.getElementById('tip');
document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-tip]'); if(!el){ tipEl.classList.remove('show'); return; } tipEl.innerHTML=el.getAttribute('data-tip'); tipEl.classList.add('show'); });
document.addEventListener('mousemove', e=>{ if(!tipEl.classList.contains('show')) return; const w=tipEl.offsetWidth, h=tipEl.offsetHeight; let x=e.clientX+14, y=e.clientY+14; if(x+w>innerWidth-8) x=e.clientX-w-14; if(y+h>innerHeight-8) y=e.clientY-h-14; tipEl.style.left=x+'px'; tipEl.style.top=y+'px'; });
document.addEventListener('scroll', ()=>tipEl.classList.remove('show'), true);

/* ---------- Export CSV / JSON ---------- */
function download(name, content, type){ const b=new Blob([content],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function csv(rows){ return '﻿'+rows.map(r=>r.map(c=>{ let s=c==null?'':(typeof c==='number'?String(Math.round(c*10)/10).replace('.',','):String(c)); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n'); }
const fileStamp = () => (S.meta.titre||'detection').replace(/[^\w\-]+/g,'_').slice(0,40);

/* =====================================================================
   VUE : TABLEAU DE BORD (feuille « Accueil » – synthèse générale)
   ===================================================================== */
function distBar(counts, labels=GRADES){
  const n=sum(counts); if(!n) return `<div class="distbar"><span style="flex:1;background:var(--surface-3)"></span></div>`;
  return `<div class="distbar">${counts.map((c,i)=>c?`<span style="flex:${c};background:var(--g${i})" data-tip="<b>${labels[i]}</b> : ${c} boule${c>1?'s':''} · ${f1(c/n*100)} %"></span>`:'').join('')}</div>`;
}
const distLegend = () => `<div class="legend">${GRADES.map((g,i)=>`<span><i style="background:var(--g${i})"></i>${g} <span class="muted">(${W_PARTIE[i]>0?'+':''}${String(W_PARTIE[i]).replace('.',',')})</span></span>`).join('')}</div>`;
function reussite(c){ const n=sum(c); return n? (c[0]+c[1]+c[2]+c[3])/n*100 : null; }

function synthByFam(rows, gp, gt){
  const fams=['P','M','T'];
  const acc = {}; fams.forEach(f=>acc[f]={p:zeros(9),t:zeros(9)});
  rows.forEach(r=>{ if(!acc[r.fam]) return; r.cu.p.forEach((v,i)=>acc[r.fam].p[i]+=v); r.cu.t.forEach((v,i)=>acc[r.fam].t[i]+=v); });
  return {acc, fams};
}
function synthTable(rows, gp, gt){
  const {acc,fams}=synthByFam(rows,gp,gt);
  const G=calcPartie(gp,gt);
  const line=(lab,o,share,cls='')=>`<tr class="${cls}"><td class="l">${lab}</td><td>${f0(o.n)}</td><td>${share==null?'–':f1(share)}</td><td>${f1(o.I)}</td><td class="${o.V<0?'neg':''}">${f1(o.V)}</td><td>${f1(o.E)}</td></tr>`;
  let h=`<table class="t"><thead><tr><th class="l">Poste</th><th>Nb BJ</th><th data-tip="Point/Tir : part des boules du poste jouées dans ce domaine. Poste : part de toutes les boules du groupe.">% BJ</th><th>% I</th><th>% V</th><th>% E</th></tr></thead><tbody>`;
  ['point','tir'].forEach(d=>{
    h+=`<tr><td class="l" colspan="6" style="background:var(--surface-2);font-weight:700;font-size:12px;letter-spacing:.05em">${d==='point'?'POINT':'TIR'}</td></tr>`;
    fams.forEach(f=>{ const C=calcPartie(acc[f].p,acc[f].t); h+=line(FAMILLES[f], C[d], C.total.n? C[d].n/C.total.n*100:null); });
    h+=line('<b>Total</b>', G[d], G.total.n? G[d].n/G.total.n*100 : null);
  });
  h+=`<tr><td class="l" colspan="6" style="background:var(--surface-2);font-weight:700;font-size:12px;letter-spacing:.05em">POSTE (POINT + TIR)</td></tr>`;
  fams.forEach(f=>{ const C=calcPartie(acc[f].p,acc[f].t); h+=line(FAMILLES[f], C.total, G.total.n? C.total.n/G.total.n*100:null); });
  h+=line('<b>Total</b>', G.total, G.total.n?100:null);
  return h+'</tbody></table>';
}

function vDash(){
  const m=S.meta;
  const sub=[m.categorie,m.lieu,m.date&&new Date(m.date).toLocaleDateString('fr-FR')].filter(Boolean).map(esc).join(' · ') || 'Renseignez la catégorie, le lieu et la date dans Paramètres';
  if(!S.players.length) return header(esc(m.titre||'Détection'), sub) + emptyPlayers();
  const all=computeAll(), {rows,GP,gp,gt}=all;
  const fc={P:0,M:0,T:0}; S.players.forEach(p=>{ if(fc[famille(p.poste)]!=null) fc[famille(p.poste)]++; });
  const parts=analysisParties(); const pst=parts.map(p=>partieStatus(p.idx));
  const saisies=pst.filter(s=>s.filled).length;
  const checks=[
    ...parts.map((p,i)=>({lab:p.nom, st:pst[i], go:`data-act="gopartie" data-i="${p.idx}"`})),
    ...SESS_KINDS.flatMap(k=>analysisSessions(k).map(x=>({lab:`${SESS_LABEL[k]} · ${x.nom}`, st:moduleStatus(k, x.data), go:`data-act="gosess" data-kind="${k}" data-id="${x.id}"`, kind:k, sid:x.id})))
  ];
  const nbErr=checks.filter(c=>c.st.state==='bad').length;
  const sel=computeSelection(all);
  const podium=['P','M','T'].map(f=>{
    const l=rows.filter(r=>r.fam===f).sort((a,b)=>sel.out.get(b.pl.id).score-sel.out.get(a.pl.id).score).slice(0,3);
    return `<div class="card"><div class="card-h"><h3>${FAMILLES[f]}</h3><span class="hint">score de sélection</span></div><div class="card-b" style="padding:8px 12px">${l.length?l.map((r,i)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="rk r${i+1}">${i+1}</span>${pbadge(r.pl.poste)}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nameBtn(r.pl)}</span><b style="font-variant-numeric:tabular-nums">${f1(sel.out.get(r.pl.id).score)}</b></div>`).join(''):'<div class="muted small">Aucun joueur</div>'}</div></div>`;
  }).join('');
  const {acc}=synthByFam(rows,gp,gt);
  const distRows=(d)=>['P','M','T'].map(f=>{ const c=acc[f][d==='point'?'p':'t']; return `<div class="distrow"><span>${FAMILLES[f]}</span>${distBar(c)}<span class="small" style="text-align:right" data-tip="% de boules notées +, A, B ou C">${reussite(c)==null?'–':f0(reussite(c))+' %'}</span></div>`; }).join('') + `<div class="distrow"><b>Groupe</b>${distBar(d==='point'?gp:gt)}<b class="small" style="text-align:right">${reussite(d==='point'?gp:gt)==null?'–':f0(reussite(d==='point'?gp:gt))+' %'}</b></div>`;
  return header(esc(m.titre||'Détection'), sub+grpLabel(), `${grpSelect()}<button class="btn" data-act="print">${ICONS.print}Imprimer</button>`) + `
  <div class="stack">
    <div class="kpis">
      <div class="kpi"><div class="k">Joueurs inscrits</div><div class="v">${S.players.length}</div><div class="s">${fc.P} pointeurs · ${fc.M} milieux · ${fc.T} tireurs</div></div>
      <div class="kpi"><div class="k">Parties saisies</div><div class="v">${saisies}<span class="muted" style="font-size:16px"> / ${parts.length}</span></div><div class="s">${f0(GP.total.n)} boules notées</div></div>
      <div class="kpi"><div class="k">Efficacité du groupe</div><div class="v">${f1(GP.total.E)}</div><div class="s">I ${f1(GP.total.I)} · V ${f1(GP.total.V)}</div></div>
      <div class="kpi"><div class="k">Réussite au point</div><div class="v">${reussite(gp)==null?'–':f0(reussite(gp))+' %'}</div><div class="s">boules notées +, A, B, C</div></div>
      <div class="kpi"><div class="k">Réussite au tir</div><div class="v">${reussite(gt)==null?'–':f0(reussite(gt))+' %'}</div><div class="s">boules notées +, A, B, C</div></div>
    </div>
    <div class="${nbErr?'alert':'alert ok'}">${nbErr?`⚠ ${nbErr} saisie${nbErr>1?'s':''} présente${nbErr>1?'nt':''} un écart entre boules jouées et boules à jouer.${errVoir(checks)}`:'✓ La saisie des résultats est juste.'}</div>
    <div class="grid g3">${podium}</div>
    <div class="grid g2">
      <div class="card"><div class="card-h"><h3>Synthèse générale des parties</h3><span class="hint">BJ = boules jouées · I = intensité · V = volume · E = efficacité</span></div><div class="tw">${synthTable(rows,gp,gt)}</div></div>
      <div class="stack">
        <div class="card"><div class="card-h"><h3>Répartition des notes — parties</h3></div><div class="card-b">
          <div class="small muted" style="margin-bottom:4px">POINT</div>${distRows('point')}
          <div class="small muted" style="margin:14px 0 4px">TIR</div>${distRows('tir')}
          <div style="margin-top:12px">${distLegend()}</div></div></div>
        <div class="card"><div class="card-h"><h3>Contrôle des saisies</h3></div><div class="card-b" style="padding:8px 16px">${checks.map(c=>`<div class="row" style="padding:5px 0">${statusDot(c.st)}<a ${c.go} style="cursor:pointer;flex:1">${esc(c.lab)}</a><span class="small muted">${c.st.filled}/${S.players.length} joueurs${c.st.bad?` · <span class="neg">${c.st.bad} écart${c.st.bad>1?'s':''}</span>`:''}</span>${c.st.state==='bad'?voirBtn(c):''}</div>`).join('')}</div></div>
      </div>
    </div>
  </div>`;
}

function parsePoste(s){
  s=String(s||'').trim().toUpperCase().replace(/[-_]/g,' ').replace(/\s+/g,' ');
  if(POSTES[s]) return s;
  const f=Object.entries(POSTES).find(([k,l])=>l.toUpperCase()===s); if(f) return f[0];
  // règle Excel (colonne Q de Liste Joueurs) : 1re lettre + initiale du 2e mot
  const w=s.split(' '); if(w[0]&&'PMT'.includes(w[0][0])){ const c=w[0][0]+(w[1]?w[1][0]:''); if(POSTES[c]) return c; return w[0][0]; }
  return '';
}

function partieRowStats(pi, pid){
  const r=getPS(pi,pid), c=calcPartie(r.p,r.t), exp=0, n=c.total.n;
  const ok = !n ? '' : (!exp||n===exp) ? '<span class="ok-i" data-tip="Nombre de boules conforme">✓</span>' : `<span class="bad-i" data-tip="${n} boules jouées pour ${exp} à jouer">${n>exp?'+':''}${n-exp}</span>`;
  const tip=(d)=>`data-tip="Point : I ${f1(c.point.I)} · V ${f1(c.point.V)} · E ${f1(c.point.E)}<br>Tir : I ${f1(c.tir.I)} · V ${f1(c.tir.V)} · E ${f1(c.tir.E)}"`;
  return `<td class="stat bl">${c.point.n||'·'}</td><td class="stat">${c.tir.n||'·'}</td><td class="stat"><b>${n||'·'}</b></td><td class="stat bl" ${tip()}>${n?f1(c.total.I):'·'}</td><td class="stat" ${tip()}>${n?f1(c.total.V):'·'}</td><td class="stat" ${tip()}><b>${n?f1(c.total.E):'·'}</b></td><td class="stat c">${ok}</td>`;
}
function entryCells(arr, mod, key, n, cls=''){
  let h=''; for(let i=0;i<n;i++){ const v=arr?arr[i]:null; const show=(v==null||v===''||(mod!=='combine'&&mod!=='tdp'&&+v===0))?'':v; h+=`<td class="${i===0?'bl':''}"><input class="cell ${cls}" data-mod="${mod}" data-k="${key}" data-i="${i}" value="${show}" placeholder="·" inputmode="numeric" autocomplete="off"></td>`; } return h;
}

  const gP=grp(p), gT=grp(t);
  return `<div class="grid g2">
    <div class="card"><div class="card-h"><h3>Statistiques de la partie</h3></div><div class="tw">${synthTable(rows,p,t)}</div></div>

      <tr><td class="l">Point</td><td>${f1(gP[0])} %</td><td>${f1(gP[1])} %</td><td>${f1(gP[2])} %</td></tr>
      <tr><td class="l">Tir</td><td>${f1(gT[0])} %</td><td>${f1(gT[1])} %</td><td>${f1(gT[2])} %</td></tr></tbody></table>

/* =====================================================================
   VUE : SAISIE DES ATELIERS (feuille « Ateliers »)
   ===================================================================== */
function atelierRowStats(pid){
  const c=calcAtelier(S.ateliers[pid]); const n=c.total.n;
  const eP=S.cfg.bjAtPoint, eT=S.cfg.bjAtTir;
  const bad = n && ((eP&&c.point.n!==eP)||(eT&&c.tir.n!==eT));
  const ok = !n?'': bad?`<span class="bad-i" data-tip="Attendu : ${eP} au point et ${eT} au tir">!</span>`:'<span class="ok-i">✓</span>';
  const tip=`data-tip="Point : ${c.point.pts} pts · I ${f1(c.point.I)} · V ${f1(c.point.V)} · E ${f1(c.point.E)}<br>Tir : ${c.tir.pts} pts · I ${f1(c.tir.I)} · V ${f1(c.tir.V)} · E ${f1(c.tir.E)}"`;
  return `<td class="stat bl ${eP&&c.point.n&&c.point.n!==eP?'warnc':''}">${c.point.n||'·'}</td><td class="stat ${eT&&c.tir.n&&c.tir.n!==eT?'warnc':''}">${c.tir.n||'·'}</td><td class="stat bl" ${tip}><b>${n?c.total.pts:'·'}</b></td><td class="stat" ${tip}>${n?f1(c.total.I):'·'}</td><td class="stat" ${tip}>${n?f1(c.total.V):'·'}</td><td class="stat" ${tip}><b>${n?f1(c.total.E):'·'}</b></td><td class="stat c">${ok}</td>`;
}
function vAteliers(){
  if(!S.players.length) return header('Saisie des ateliers','')+emptyPlayers();
  const list=sortedPlayers().filter(p=>!UI.search||p.nom.toLowerCase().includes(UI.search.toLowerCase()));
  const st=moduleStatus('ateliers');
  return header('Saisie des ateliers', 'Ateliers de point et de tir : nombre de boules par note (barème 0 / 1 / 3 / 5)', grpSelect()) + sessBar('ateliers') + `
  <div class="card">
    <div class="card-h">${statusDot(st)}<span class="small">${st.filled}/${S.players.length} joueurs saisis</span>
      <div class="field" style="width:130px;margin-left:16px"><label>Boules point / joueur</label><input class="inp" data-cfg="bjAtPoint" value="${S.cfg.bjAtPoint}" inputmode="numeric"></div>
      <div class="field" style="width:130px"><label>Boules tir / joueur</label><input class="inp" data-cfg="bjAtTir" value="${S.cfg.bjAtTir}" inputmode="numeric"></div>
      <div class="right"><input class="inp search" placeholder="Filtrer…" data-ui="search" value="${esc(UI.search)}"></div></div>
    <div class="tw" style="max-height:72vh"><table class="t ent">
      <thead><tr><th class="name" rowspan="2">Joueur</th><th rowspan="2" class="c">Poste</th><th colspan="5" class="grp">Point</th><th colspan="4" class="grp">Tir</th><th colspan="2" class="grp">BJ</th><th colspan="4" class="grp">Total</th><th rowspan="2"></th></tr>
      <tr>${AT_P.map((g,i)=>`<th class="c gh ${i===0?'bl':''}" data-tip="Note ${g} — volume ${String(VOL_AT_P[i]).replace('.',',')}">${g}<small>v ${String(VOL_AT_P[i]).replace('.',',')}</small></th>`).join('')}${AT_T.map((g,i)=>`<th class="c gh ${i===0?'bl':''}" data-tip="Note ${g} — volume ${String(VOL_AT_T[i]).replace('.',',')}">${g}<small>v ${String(VOL_AT_T[i]).replace('.',',')}</small></th>`).join('')}<th class="bl">Pt</th><th>Tir</th><th class="bl">Pts</th><th>I</th><th>V</th><th>E</th></tr></thead>
      <tbody>${list.map(pl=>{ const a=S.ateliers[pl.id]; return `<tr data-id="${pl.id}"><td class="name">${nameBtn(pl)}</td><td class="c">${pbadge(pl.poste)}</td>${entryCells(a&&a.p,'atelier','p',5)}${entryCells(a&&a.t,'atelier','t',4)}${atelierRowStats(pl.id)}</tr>`; }).join('')}</tbody>
    </table></div>
  </div>
  <details class="help" style="margin-top:16px"><summary>Comment sont calculés les indicateurs des ateliers ?</summary><ul>
    <li><b>Points</b> : point = −1×n(−1) + n(1) + 3×n(3) + 5×n(5) ; tir = −1×n(0) + n(1) + 3×n(3) + 5×n(5) (une boule nulle au tir coûte 1 point).</li>
    <li><b>Intensité point</b> = (n(3) + n(5) + 0,75×n(1)) / BJ ; <b>intensité tir</b> = (n(1)+n(3)+n(5)) / BJ.</li>
    <li><b>Volume</b> = Σ(poids × nb) / BJ avec les poids indiqués sous chaque note ; <b>Efficacité</b> = moyenne(I, V).</li></ul></details>`;
}

/* =====================================================================
   VUE : COMBINÉ (feuilles « Combine » / « Resultats Combine »)
   ===================================================================== */
function combineRowStats(pid){
  const c=calcCombine(S.combine[pid]); const exp=S.cfg.bjCombine;
  const ok=!c.bj?'':c.bj===exp?'<span class="ok-i">✓</span>':`<span class="bad-i" data-tip="${c.bj} boules notées pour ${exp}">${c.bj-exp}</span>`;
  return c.seq.map((s,k)=>`<td class="stat ${k===0?'bl':''}" data-tip="${s.pts} pts · réussite ${f0(s.reu)} %">${c.bj?f0(s.pct):'·'}</td>`).join('') + `<td class="stat bl">${c.bj?f0(c.point.pct):'·'}</td><td class="stat">${c.bj?f0(c.tir.pct):'·'}</td><td class="stat bl"><b>${c.bj?c.total.pts:'·'}</b></td><td class="stat"><b>${c.bj?f1(c.total.pct):'·'}</b></td><td class="stat">${c.bj?f0(c.total.reu):'·'}</td><td class="stat c">${ok}</td>`;
}
function vCombine(){
  if(!S.players.length) return header('Combiné','')+emptyPlayers();
  const D=S.cfg.combineDist, list=sortedPlayers().filter(p=>!UI.search||p.nom.toLowerCase().includes(UI.search.toLowerCase()));
  const st=moduleStatus('combine');
  let h1='', h2='';
  for(let k=0;k<4;k++){ h1+=`<th colspan="6" class="grp">Séq. ${k+1} · ${D[k]} m</th>`; h2+=['P1','P2','P3','T1','T2','T3'].map((x,i)=>`<th class="c ${i===0?'bl':''}" style="${i>2?'color:var(--accent)':''}">${x}</th>`).join(''); }
  const cells=(pid)=>{ const c=S.combine[pid]||{p:Array(12).fill(null),t:Array(12).fill(null)}; let h=''; for(let k=0;k<4;k++){ for(let i=0;i<3;i++) h+=cellOne(c.p[k*3+i],'combine','p',k*3+i,i===0); for(let i=0;i<3;i++) h+=cellOne(c.t[k*3+i],'combine','t',k*3+i,false); } return h; };
  return header('Combiné', 'Une note par boule : 0, 1 ou 2 · saisissez le chiffre, le curseur avance tout seul · P = point, T = tir', grpSelect()) + sessBar('combine') + `
  <div class="card">
    <div class="card-h">${statusDot(st)}<span class="small">${st.filled}/${S.players.length} joueurs saisis · ${S.cfg.bjCombine} boules attendues</span><div class="right"><input class="inp search" placeholder="Filtrer…" data-ui="search" value="${esc(UI.search)}"></div></div>
    <div class="tw" style="max-height:72vh"><table class="t ent">
      <thead><tr><th class="name" rowspan="2">Joueur</th><th rowspan="2">Poste</th>${h1}<th colspan="4" class="grp">% par séquence</th><th colspan="2" class="grp">% pts</th><th colspan="3" class="grp">Total</th><th rowspan="2"></th></tr>
      <tr>${h2}${D.map((d,k)=>`<th class="${k===0?'bl':''}">S${k+1}</th>`).join('')}<th class="bl">Point</th><th>Tir</th><th class="bl">Pts</th><th>% pts</th><th data-tip="% de boules ayant rapporté au moins 1 point">% réus.</th></tr></thead>
      <tbody>${list.map(pl=>`<tr data-id="${pl.id}"><td class="name">${nameBtn(pl)}</td><td class="c">${pbadge(pl.poste)}</td>${cells(pl.id)}${combineRowStats(pl.id)}</tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}
function cellOne(v, mod, k, i, bl){ return `<td class="${bl?'bl':''}"><input class="cell w" data-mod="${mod}" data-k="${k}" data-i="${i}" value="${v==null?'':v}" placeholder="·" inputmode="numeric" maxlength="1" autocomplete="off"></td>`; }

/* =====================================================================
   VUE : TIR DE PRÉCISION (feuilles « Tir de Precision » / « Resultats TdP »)
   ===================================================================== */
function tdpRowStats(pid){
  const c=calcTdp(S.tdp[pid]), exp=S.cfg.bjTdp;
  const ok=!c.bj?'':c.bj===exp?'<span class="ok-i">✓</span>':`<span class="bad-i" data-tip="${c.bj} boules notées pour ${exp}">${c.bj-exp}</span>`;
  return c.dist.map((d,k)=>`<td class="stat ${k===0?'bl':''}" data-tip="${d.pts} pts / 25 · réussite ${f0(d.reu)} %">${c.bj?f0(d.pct):'·'}</td>`).join('') + `<td class="stat bl"><b>${c.bj?c.total.pts:'·'}</b></td><td class="stat">${c.bj?f0(c.total.reu):'·'}</td><td class="stat c">${ok}</td>`;
}
function vTdp(){
  if(!S.players.length) return header('Tir de précision','')+emptyPlayers();

    <div class="tw" style="max-height:72vh"><table class="t ent">
      <thead><tr><th class="name" rowspan="2">Joueur</th><th rowspan="2">Poste</th>${h1}<th colspan="4" class="grp">% points par distance</th><th colspan="2" class="grp">Total</th><th rowspan="2"></th></tr>
      <tr>${h2}${D.map((d,k)=>`<th class="${k===0?'bl':''}">${d} m</th>`).join('')}<th class="bl">Pts</th><th>% réus.</th></tr></thead>
      <tbody>${list.map(pl=>`<tr data-id="${pl.id}"><td class="name">${nameBtn(pl)}</td><td class="c">${pbadge(pl.poste)}</td>${cells(pl.id)}${tdpRowStats(pl.id)}</tr>`).join('')}</tbody>

/* =====================================================================
   VUE : CLASSEMENTS (feuilles « Classement Parties », « Classement Ateliers »,
   « Resultats Combine », « Resultats TdP »)
   ===================================================================== */
const CONCERNES = {point:['P','PM'], tir:['T','TM'], total:['M','MP','MT']};
let LAST_TABLE = null; // pour l'export CSV de la vue courante

function vClassements(){
  if(!S.players.length) return header('Classements','')+emptyPlayers();
  if(!['parties','ateliers','combine','tdp'].includes(UI.clsTab)) UI.clsTab='parties';
  const tab=UI.clsTab;
  const tabs=`<div class="seg">${[['parties','Parties'],['ateliers','Ateliers'],['combine','Combiné'],['tdp','Tir de précision']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="clsTab" data-v="${k}">${l}</button>`).join('')}</div>`;
  const all=computeAll();
  let body = tab==='parties'||tab==='ateliers' ? clsIVE(all, tab) : tab==='combine' ? clsCombine(all) : clsTdp(all);
  return header('Classements', 'Classement des joueurs par indicateur, avec les seuils de détection'+grpLabel(), `${grpSelect()}<button class="btn" data-act="exportTable">${ICONS.down}CSV</button><button class="btn" data-act="print">${ICONS.print}Imprimer</button>`) + `<div class="stack"><div class="row">${tabs}</div>${body}</div>`;
}
function clsIVE(all, tab){
  const dom=UI.clsDom, isAt=tab==='ateliers';
  const sortKeys = isAt?[['I','Intensité'],['V','Volume'],['E','Efficacité'],['pts','Points']]:[['I','Intensité'],['V','Volume'],['E','Efficacité']];
  if(!sortKeys.find(k=>k[0]===UI.clsSort)) UI.clsSort='E';
  const key=UI.clsSort, sec = key==='I'?'V':'I';
  const th = isAt? all.th.ateliers[dom] : all.th.parties[dom];
  const G = isAt? all.GA[dom] : all.GP[dom];
  const get = r => isAt? r.A[dom] : r.P[dom];
  const expT = expectedParties();
  let rows = all.rows.map(r=>({r, o:get(r)}));
  if(UI.clsFocus) rows=rows.filter(x=>CONCERNES[dom].includes(x.r.pl.poste));
  rows.sort((a,b)=> (b.o.n?1:0)-(a.o.n?1:0) || b.o[key]-a.o[key] || b.o[sec]-a.o[sec] || a.r.pl.nom.localeCompare(b.r.pl.nom,'fr'));
  let rank=0;
  const body = rows.map((x,i)=>{
    const {r,o}=x; if(o.n) rank++;
    const concerned=CONCERNES[dom].includes(r.pl.poste);
    let warn=false, wtip='';
    if(isAt){ const eP=S.cfg.bjAtPoint, eT=S.cfg.bjAtTir; const ns=r.A.ns||1; if(r.A.total.n && ((eP&&r.A.point.n!==eP*ns)||(eT&&r.A.tir.n!==eT*ns))){warn=true; wtip=`Boules attendues : ${eP*ns} point + ${eT*ns} tir (${ns} session${ns>1?'s':''})`;} }
    else if(o.n && expT && r.P.total.n!==expT){ warn=true; wtip=`${r.P.total.n} boules jouées sur ${expT} à jouer (${r.cu.nb} partie${r.cu.nb>1?'s':''})`; }
    return `<tr class="${concerned||UI.clsFocus?'':'dim'}"><td class="c">${o.n?`<span class="rk ${rank<=3?'r'+rank:''}">${rank}</span>`:''}</td><td class="name">${nameBtn(r.pl)}</td><td class="c">${pbadge(r.pl.poste)}</td>
      <td class="${warn?'warnc':''}" ${warn?`data-tip="${esc(wtip)}"`:''}>${o.n||'–'}${warn?' ⚠':''}</td>
      ${isAt?(o.n?tierCell(o.pts, th.pts):'<td>–</td>'):`<td class="muted">${r.cu.nb||'–'}</td>`}
      ${o.n?tierCell(o.I,th.I,'bl'):'<td class="bl">–</td>'}${o.n?tierCell(o.V,th.V):'<td>–</td>'}${o.n?tierCell(o.E,th.E):'<td>–</td>'}</tr>`;
  }).join('');
  LAST_TABLE = {name:`classement_${tab}_${dom}`, rows:[['Rang','Joueur','Poste','BJ',isAt?'Points':'Parties','Intensité','Volume','Efficacité'], ...rows.map((x,i)=>[x.o.n?i+1:'', x.r.pl.nom, x.r.pl.poste, x.o.n, isAt?x.o.pts:x.r.cu.nb, x.o.I, x.o.V, x.o.E])]};
  const thr = (lab,t)=>`<span>${lab} : moy. <b>${f1(t.moy)}</b> · S1 <b>${f1(t.s1)}</b> · S2 <b>${f1(t.s2)}</b></span>`;
  const sh=(k,lab,extra='')=>`<th class="sort ${key===k?'sorted':''} ${extra}" data-act="clsSort" data-v="${k}">${lab}${key===k?' ↓':''}</th>`;
  return `<div class="card">
    <div class="card-h">
      <div class="seg">${['point','tir','total'].map(d=>`<button class="${dom===d?'on':''}" data-act="clsDom" data-v="${d}">${DOM_LABEL[d]}</button>`).join('')}</div>
      <div class="seg">${sortKeys.map(([k,l])=>`<button class="${key===k?'on':''}" data-act="clsSort" data-v="${k}">${l}</button>`).join('')}</div>
      <label class="row small"><input type="checkbox" data-act="clsFocus" ${UI.clsFocus?'checked':''}>Uniquement les postes concernés (${CONCERNES[dom].join(', ')})</label>
    </div>
    <div class="card-b" style="padding:10px 16px;border-bottom:1px solid var(--line)"><div class="thr">${isAt?thr('Points',th.pts):''}${thr('Intensité',th.I)}${thr('Volume',th.V)}${thr('Efficacité',th.E)}</div></div>
    <div class="tw" style="max-height:70vh"><table class="t">
      <thead><tr><th class="c">Rang</th><th class="name">Joueur</th><th class="c">Poste</th><th>BJ</th>${isAt?sh('pts','Pts'):'<th>Parties</th>'}${sh('I','% Int.','bl')}${sh('V','% Vol.')}${sh('E','% Eff.')}</tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td></td><td class="name l" style="background:var(--surface-2)">Moyenne du groupe</td><td></td><td>${f0(G.n)}</td><td>${isAt?f1(th.pts.moy):''}</td><td class="bl">${f1(G.I)}</td><td>${f1(G.V)}</td><td>${f1(G.E)}</td></tr></tfoot>
    </table></div>
    <div class="card-b">${legendTiers()}<div class="small muted" style="margin-top:6px">Lignes estompées : postes non concernés par ce domaine (comme la mise en forme du classeur). ⚠ = nombre de boules jouées différent du nombre de boules à jouer.</div></div>
  </div>`;
}
function sortableTable(cfg){
  // cfg: {id, cols:[{k,lab,fmt,cls,tip}], rows:[{pl, vals:{}}], sortKey, dir}
  const k=cfg.sortKey, dir=cfg.dir;
  const rows=[...cfg.rows].sort((a,b)=> (b.has?1:0)-(a.has?1:0) || dir*((a.vals[k]??-1e9)-(b.vals[k]??-1e9)) || a.pl.nom.localeCompare(b.pl.nom,'fr'));
  let rank=0;
  LAST_TABLE={name:cfg.id, rows:[['Rang','Joueur','Poste',...cfg.cols.map(c=>(c.csv||c.lab).replace(/<[^>]+>/g,''))], ...rows.map((r,i)=>[r.has?i+1:'', r.pl.nom, r.pl.poste, ...cfg.cols.map(c=>r.vals[c.k])])]};
  return `<table class="t"><thead>${cfg.head||''}<tr><th class="c">Rang</th><th class="name">Joueur</th><th class="c">Poste</th>${cfg.cols.map(c=>`<th class="sort ${k===c.k?'sorted':''} ${c.cls||''}" data-act="${cfg.act}" data-v="${c.k}" ${c.tip?`data-tip="${c.tip}"`:''}>${c.lab}${k===c.k?(dir<0?' ↓':' ↑'):''}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>{ if(r.has) rank++; return `<tr><td class="c">${r.has?`<span class="rk ${rank<=3?'r'+rank:''}">${rank}</span>`:''}</td><td class="name">${nameBtn(r.pl)}</td><td class="c">${pbadge(r.pl.poste)}</td>${cfg.cols.map(c=>{ const v=r.vals[c.k]; if(!r.has||v==null) return `<td class="${c.cls||''}">–</td>`; return c.tier? tierCell(v,c.tier,c.cls||'',c.fmt||f1) : `<td class="${c.cls||''}">${c.fmt?c.fmt(v):f1(v)}</td>`; }).join('')}</tr>`; }).join('')}</tbody></table>`;
}
function simpleTh(rows, getV){ const items=rows.map(r=>({v:getV(r), w:getV(r)==null?0:1})).filter(x=>x.w); const m=items.length?sum(items.map(x=>x.v))/items.length:0; return seuils(items,m); }
function clsCombine(all){
  const D=S.cfg.combineDist;
  const rows=all.rows.map(r=>({pl:r.pl, has:!!r.C.bj, vals:{s0:r.C.seq[0].pct,s1:r.C.seq[1].pct,s2:r.C.seq[2].pct,s3:r.C.seq[3].pct, pp:r.C.point.pct, tp:r.C.tir.pct, pts:r.C.total.pts, pct:r.C.total.pct, reu:r.C.total.reu}}));
  const thT=simpleTh(rows.filter(r=>r.has), r=>r.vals.pct);
  const key=UI.cmbSort||'pct';
  const cols=[...D.map((d,k)=>({k:'s'+k, lab:`S${k+1} · ${d} m`, fmt:f0, cls:k===0?'bl':''})), {k:'pp',lab:'% Point',fmt:f0,cls:'bl'},{k:'tp',lab:'% Tir',fmt:f0},{k:'pts',lab:'Pts /48',fmt:f0,cls:'bl'},{k:'pct',lab:'% Total',tier:thT},{k:'reu',lab:'% Réussite',fmt:f0,tip:'Boules ayant rapporté au moins 1 point'}];
  return `<div class="card"><div class="card-b" style="padding:10px 16px;border-bottom:1px solid var(--line)"><div class="thr"><span>% Total : moy. <b>${f1(thT.moy)}</b> · S1 <b>${f1(thT.s1)}</b> · S2 <b>${f1(thT.s2)}</b></span><span class="muted">Cliquez un en-tête pour trier</span></div></div>
    <div class="tw" style="max-height:70vh">${sortableTable({id:'classement_combine', act:'cmbSort', cols, rows, sortKey:key, dir:UI.cmbDir})}</div><div class="card-b">${legendTiers()}</div></div>`;
}
function clsTdp(all){
  const D=S.cfg.tdpDist;
  const rows=all.rows.map(r=>({pl:r.pl, has:!!r.T.bj, vals:Object.assign({}, ...r.T.dist.map((d,k)=>({['d'+k]:d.pct, ['dp'+k]:d.pts})), ...r.T.at.map((a,k)=>({['a'+k]:a.pct, ['ap'+k]:a.pts})), {pts:r.T.total.pts, reu:r.T.total.reu})}));
  const thT=simpleTh(rows.filter(r=>r.has), r=>r.vals.pts);
  const key=UI.tdpSort||'pts';
  const cols=[...D.map((d,k)=>({k:'dp'+k, lab:`${d} m`, csv:`Pts ${d} m`, fmt:f0, cls:k===0?'bl':'', tip:'Total de points à cette distance (sur 25)'})), ...D.map((d,k)=>({k:'d'+k, lab:`${d} m`, csv:`% ${d} m`, fmt:f0, cls:k===0?'bl':''})), ...[0,1,2,3,4].map(k=>({k:'ap'+k, lab:`A${k+1}`, csv:`Pts A${k+1}`, fmt:f0, cls:k===0?'bl':'', tip:'Total de points de l’atelier (sur 20)'})), ...[0,1,2,3,4].map(k=>({k:'a'+k, lab:`A${k+1}`, csv:`% A${k+1}`, fmt:f0, cls:k===0?'bl':''})), {k:'pts',lab:'Total /100',tier:thT,cls:'bl',fmt:f0},{k:'reu',lab:'% Réussite',fmt:f0}];

function vRegularite(){
  if(!S.players.length) return header('Régularité','')+emptyPlayers();
  const all=computeAll(), met=UI.regMet, [lo,hi]=S.cfg.seuils[met];
  const parts=all.parts;
  const domOf = r => UI.regDom==='auto'? r.dom : UI.regDom;
  const rows = all.rows.map(r=>{
    const d=domOf(r);
    const vals = r.perGame.map(g=> g && g[d].n ? g[d][met] : null);
    const v=vals.filter(x=>x!=null); const m=v.length?sum(v)/v.length:null;
    const sd=v.length>1?Math.sqrt(sum(v.map(x=>(x-m)**2))/(v.length-1)):null;
    return {r, d, vals, glob:r.P[d].n?r.P[d][met]:null, m, sd, nHi:v.filter(x=>x>hi).length, nLo:v.filter(x=>x<lo).length, nb:v.length};
  }).sort((a,b)=>(b.glob!=null)-(a.glob!=null) || (b.glob??0)-(a.glob??0));
  const cls=v=> v==null?'':v<lo?'lo':v>hi?'hi':'';
  const ML={I:'Intensité',V:'Volume',E:'Efficacité'};

    </div>
    <div class="tw" style="max-height:72vh"><table class="t">
      <thead><tr><th class="name">Joueur</th><th class="c">Poste</th><th class="c">Dom.</th>${parts.map((p,i)=>`<th class="${i===0?'bl':''}" data-tip="${esc(p.nom)}">P${p.idx+1}</th>`).join('')}<th class="bl">Global</th><th data-tip="Écart-type des parties : plus il est faible, plus le joueur est régulier">σ</th><th data-tip="Nombre de parties au-dessus du seuil haut">▲</th><th data-tip="Nombre de parties sous le seuil bas">▼</th></tr></thead>
      <tbody>

        ${rows.map(x=>`<tr><td class="name">${nameBtn(x.r.pl)}</td><td class="c">${pbadge(x.r.pl.poste)}</td><td class="c small muted">${DOM_LABEL[x.d]}</td>${x.vals.map((v,i)=>`<td class="${i===0?'bl':''}"><span class="tier ${cls(v)}" style="min-width:42px">${v==null?'–':f1(v)}</span></td>`).join('')}<td class="bl"><b>${f1(x.glob)}</b></td><td class="muted">${x.sd==null?'–':f1(x.sd)}</td><td>${x.nb?x.nHi:'–'}</td><td>${x.nb?x.nLo:'–'}</td></tr>`).join('')}

function autoSelect(){
  const all=computeAll(), {out}=computeSelection(all);
  ['P','M','T'].forEach(f=>{
    const ids=all.rows.filter(r=>r.fam===f).map(r=>r.pl.id).sort((a,b)=>out.get(b).score-out.get(a).score);
    const q=+S.cfg.quotas[f]||0, rs=+S.cfg.reserves[f]||0;
    ids.forEach((id,i)=>{ S.sel[id]= i<q?'R': i<q+rs?'S':'X'; });
  });
  save(); render(); toast('Sélection proposée selon les scores et les quotas');
}

/* =====================================================================
   FICHE JOUEUR (modale)
   ===================================================================== */
function lineChart(labels, series, ref, opts={}){
  const W=520,H=230,L=36,R=22,T=12,B=26;
  const vals=[...series.flatMap(s=>s.v),...(ref?ref.v:[])].filter(v=>v!=null);
  if(!vals.length) return '<div class="muted small" style="padding:20px 0">Aucune partie saisie.</div>';
  let mn=Math.min(0,...vals), mx=Math.max(...vals); const pad=(mx-mn)*.1||10; mx=Math.ceil((mx+pad)/10)*10; mn=Math.floor(Math.min(mn,mn-(mn<0?pad:0))/10)*10;
  const n=labels.length, x=i=> n<=1? (L+W-R)/2 : L+i*(W-L-R)/(n-1), y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  const ticks=[]; const step=Math.max(10,Math.ceil((mx-mn)/5/10)*10); for(let v=mn; v<=mx; v+=step) ticks.push(v);
  const path=(arr)=>{ let d='',pen=false; arr.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); pen=true; }); return d; };
  let g=`<g class="grid">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}</g>`;
  if(mn<0) g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" class="axis"/>`;
  g+=labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`).join('');
  if(ref) g+=`<path d="${path(ref.v)}" fill="none" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  series.forEach(s=>{ g+=`<path d="${path(s.v)}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`; g+=s.v.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`).join(''); });
  // zones de survol (une colonne par partie)
  const bw = n<=1? (W-L-R) : (W-L-R)/(n-1);
  g+=labels.map((l,i)=>{ const tip=`<b>${esc(opts.full?opts.full[i]:l)}</b><br>`+series.map(s=>`${esc(s.name)} : ${s.v[i]==null?'–':f1(s.v[i])}`).join('<br>')+(ref?`<br>${esc(ref.name)} : ${ref.v[i]==null?'–':f1(ref.v[i])}`:''); return `<rect x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-tip="${esc(tip)}"/>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title||'Graphique')}">${g}</svg>`;
}

function demoData(){
  const noms=['MARTIN Léo','BERNARD Inès','THOMAS Hugo','PETIT Chloé','ROBERT Nathan','RICHARD Manon','DURAND Lucas','DUBOIS Jade','MOREAU Enzo','LAURENT Lina','SIMON Tom','MICHEL Léna','LEFEBVRE Noah','LEROY Zoé','ROUX Mathis','DAVID Lou','BERTRAND Rayan','MOREL Alice'];
  const postes=['P','P','PM','P','PM','M','MP','MT','M','M','MT','T','T','TM','T','TM','P','M'];
  const cds=['38','43','69','42','63','26','07','01','73','74','15','03','38','43','69','42','63','26'];
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  const pick=(w)=>{ const t=sum(w); let x=rnd()*t; for(let i=0;i<w.length;i++){ x-=w[i]; if(x<=0) return i; } return w.length-1; };
  const s=defaultState();
  s.meta={titre:'Détection régionale — Juniors', categorie:'Juniors', lieu:'Yssingeaux (43)', date:'2026-10-10', educateur:'Équipe technique'};
  s.cfg.nbParties=6;
  s.groupes=[{id:'g1',nom:'Stage 1',date:'2026-10-10'},{id:'g2',nom:'Stage 2',date:'2026-10-24'}];
  s.parties.forEach((p,i)=>p.g= i<3?'g1':'g2');
  s.parties.forEach((p,i)=>{ if(i<6) p.date = i<3?'2026-10-10':i<5?'2026-10-24':'2026-10-25'; });
  SESS_KINDS.forEach(k=>{ s.sessions[k][0].date='2026-10-10'; s.sessions[k].push(Object.assign(newSess(2,'g2'),{date:'2026-10-24'}), Object.assign(newSess(3,'g2'),{date:'2026-10-25'})); });
  s.players=noms.map((n,i)=>({id:'d'+i, nom:n, cd:cds[i], annee:String(2008+(i%4)), poste:postes[i], club:''}));
  s.players.forEach((pl,i)=>{
    const sk = 0.25 + rnd()*0.75; // niveau 0,25 → 1
    const w = [1+6*sk, 3+6*sk, 6+4*sk, 6, 5, 6-3*sk, 5-3*sk, 3-2*sk, 2-1.6*sk].map(x=>Math.max(.2,x));
    const share = {P:.9,PM:.75,M:.5,MP:.65,MT:.35,T:.12,TM:.25}[pl.poste];
    for(let g=0; g<6; g++){
      if(rnd()<0.06) continue; // absence
      const p=zeros(9), t=zeros(9); const bj=s.parties[g].bj;
      for(let b=0;b<bj;b++){ const isP = rnd()<share; const wf=w.map((x,k)=>x*(0.75+rnd()*0.5)); (isP?p:t)[pick(wf)]++; }
      s.parties[g].s[pl.id]={p,t};
    }
    const ap=zeros(5), at=zeros(4);
    for(let b=0;b<20;b++) ap[pick([0.6-0.4*sk, 3-1.5*sk, 6, 4+4*sk, 1+5*sk])]++;
    for(let b=0;b<20;b++) at[pick([5-3*sk, 4, 3+3*sk, 2+6*sk])]++;
    s.ateliers[pl.id]={p:ap,t:at};
    s.combine[pl.id]={p:Array.from({length:12},()=>pick([3-2*sk,4,2+4*sk])), t:Array.from({length:12},()=>pick([4-2.5*sk,3,1+5*sk]))};
    s.tdp[pl.id]=Array.from({length:20},()=>[0,1,3,5][pick([5-3.5*sk,4,3+2*sk,1+4*sk])]);
    [1,2].forEach(j=>{ const k2=Math.max(0.1,Math.min(1, sk+(j===1?-0.18:0.06)+(rnd()-0.5)*0.25)); // session 2 : conditions difficiles
      const ap2=zeros(5), at2=zeros(4); for(let b=0;b<20;b++) ap2[pick([0.6-0.4*k2, 3-1.5*k2, 6, 4+4*k2, 1+5*k2])]++; for(let b=0;b<20;b++) at2[pick([5-3*k2, 4, 3+3*k2, 2+6*k2])]++;
      s.sessions.ateliers[j].data[pl.id]={p:ap2,t:at2};
      s.sessions.combine[j].data[pl.id]={p:Array.from({length:12},()=>pick([3-2*k2,4,2+4*k2])), t:Array.from({length:12},()=>pick([4-2.5*k2,3,1+5*k2]))};
      s.sessions.tdp[j].data[pl.id]=Array.from({length:20},()=>[0,1,3,5][pick([5-3.5*k2,4,3+2*k2,1+4*k2])]); });
  });
  return s;
}

const ALLOWED = {combine:['0','1','2'], tdp:['0','1','3','5']};
function setCell(inp){
  const mod=inp.dataset.mod, k=inp.dataset.k, i=+inp.dataset.i, tr=inp.closest('tr'), id=tr.dataset.id;
  let raw=inp.value.trim();
  if(mod==='partie'||mod==='atelier'){
    let v=parseInt(raw,10); if(isNaN(v)||v<0) v=0; if(raw!==''&&String(v)!==raw) inp.value=v||'';
    if(mod==='partie'){ const pa=S.parties[UI.pi]; const r=pa.s[id]||(pa.s[id]={p:zeros(9),t:zeros(9)}); r[k][i]=v; if(!sum(r.p)&&!sum(r.t)) delete pa.s[id]; }
    else { const a=S.ateliers[id]||(S.ateliers[id]={p:zeros(5),t:zeros(4)}); a[k][i]=v; if(!sum(a.p)&&!sum(a.t)) delete S.ateliers[id]; }
  } else {
    const ok=ALLOWED[mod]; let v=null;
    if(raw!==''){ const ch=raw.slice(-1); if(ok.includes(ch)){ v=+ch; inp.value=ch; } else { inp.value=''; inp.classList.add('warnc'); setTimeout(()=>inp.classList.remove('warnc'),400); toast(`Valeur autorisée : ${ok.join(', ')}`); } }
    if(mod==='combine'){ const c=S.combine[id]||(S.combine[id]={p:Array(12).fill(null),t:Array(12).fill(null)}); c[k][i]=v; }
    else { const t=S.tdp[id]||(S.tdp[id]=Array(20).fill(null)); t[i]=v; }
    if(v!=null) moveCell(inp,0,1);
  }
  refreshRow(tr, mod, id);
  save();
}
function refreshRow(tr, mod, id){
  const nIn=tr.querySelectorAll('input.cell').length;
  const html = mod==='partie'?partieRowStats(UI.pi,id): mod==='atelier'?atelierRowStats(id): mod==='combine'?combineRowStats(id): tdpRowStats(id);
  const tds=[...tr.children]; const keep=2+nIn; tds.slice(keep).forEach(td=>td.remove());
  tr.insertAdjacentHTML('beforeend', html);
  if(mod==='partie'){ clearTimeout(refreshRow._t); refreshRow._t=setTimeout(()=>{ const el=document.getElementById('partieStats'); if(el) el.innerHTML=partieStatsHTML(UI.pi); const ch=document.querySelector(`.chip.on .dot`); if(ch){ const st=partieStatus(UI.pi); ch.className='dot '+({ok:'ok',bad:'bad',part:'part',empty:''}[st.state]); } },300); }
}
function moveCell(inp, dr, dc){
  const tr=inp.closest('tr'), cells=[...tr.querySelectorAll('input.cell')], ci=cells.indexOf(inp);
  let target=null;
  if(dc){ target=cells[ci+dc]; if(!target && dc>0){ const nx=tr.nextElementSibling; if(nx) target=nx.querySelector('input.cell'); } }
  if(dr){ let row=dr>0?tr.nextElementSibling:tr.previousElementSibling; if(row){ const c=row.querySelectorAll('input.cell'); target=c[ci]; } }
  if(target){ target.focus(); target.select(); }
}
document.addEventListener('keydown', e=>{
  const t=e.target;
  if(e.key==='Escape' && document.getElementById('modal').innerHTML){ closeModal(); return; }
  if(!t.classList || !t.classList.contains('cell')) return;
  const mod=t.dataset.mod;
  if(e.key==='ArrowDown'||e.key==='Enter'){ e.preventDefault(); moveCell(t,1,0); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); moveCell(t,-1,0); }
  else if(e.key==='ArrowRight' && (t.selectionStart===t.value.length)){ e.preventDefault(); moveCell(t,0,1); }
  else if(e.key==='ArrowLeft' && (t.selectionStart===0)){ e.preventDefault(); moveCell(t,0,-1); }
  else if((mod==='partie'||mod==='atelier') && (e.key==='+'||e.key==='-'||e.key==='=')){
    e.preventDefault(); let v=parseInt(t.value,10)||0; v=Math.max(0, v+(e.key==='-'?-1:1)); t.value=v||''; setCell(t);
  }
});
document.addEventListener('focusin', e=>{ if(e.target.classList&&e.target.classList.contains('cell')) setTimeout(()=>e.target.select(),0); });
document.addEventListener('input', e=>{
  const t=e.target, d=t.dataset;
  if(t.classList.contains('cell')) return setCell(t);
