  if(d.meta){ S.meta[d.meta]=t.value; save(); if(d.meta==='titre') nav(); return; }
  if(d.note){ S.notes[d.note]=t.value; save(); document.querySelectorAll(`[data-note="${d.note}"]`).forEach(x=>{ if(x!==t) x.value=t.value; }); return; }
  if(d.poids){ S.cfg.poids[d.poids]=+t.value; save(); clearTimeout(window._pw); window._pw=setTimeout(render,120); return; }
});
document.addEventListener('change', e=>{
  const t=e.target, d=t.dataset;
  if(d.pf==='poste'){ const pl=playerById(t.closest('tr').dataset.id); pl.poste=t.value; save(); return; }
  if(d.cfg){ let v=parseInt(t.value,10)||0; if(d.cfg==='nbParties'){ v=Math.min(MAXP,Math.max(1,v)); const old=S.cfg.nbParties; for(let i=old;i<v;i++){ const p=S.parties[i]; if(!Object.keys(p.s).length) p.g=S.parties[old-1].g; } } S.cfg[d.cfg]=v; save(); render(); return; }
  if(d.grpf!==undefined){ UI.grp=t.value; saveUI(); render(); return; }
  if(d.pg!==undefined){ S.parties[+d.pg].g=t.value; save(); render(); return; }
  if(d.gmeta){ const g=groupeById(d.gid); if(g){ g[d.gmeta]=t.value; save(); render(); } return; }
  if(d.pbj){ S.parties[+d.pbj].bj=parseInt(t.value,10)||0; save(); render(); return; }
  if(d.dist){ const arr=t.value.split(/[\/;, ]+/).map(Number).filter(x=>!isNaN(x)&&x>0); if(arr.length===4){ S.cfg[d.dist]=arr; save(); } else toast('Indiquez 4 distances, ex. 6 / 7 / 8 / 9'); render(); return; }
  if(d.seuil){ S.cfg.seuils[d.seuil][+d.j]=parseFloat(String(t.value).replace(',','.'))||0; save(); render(); return; }
  if(d.cfgs){ S.cfg[d.cfgs]= d.cfgs==='parFamille' ? t.value==='1' : t.value; save(); render(); return; }
  if(d.quota){ S.cfg.quotas[d.quota]=parseInt(t.value,10)||0; save(); render(); return; }
  if(d.reserve){ S.cfg.reserves[d.reserve]=parseInt(t.value,10)||0; save(); render(); return; }
  if(t.id==='importJSON' && t.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ const o=JSON.parse(fr.result); if(!o.players) throw 0; S=merge(defaultState(),o); save(); render(); toast('Données importées'); }catch(err){ toast('Fichier non reconnu'); } }; fr.readAsText(t.files[0]); }
});
document.addEventListener('toggle', e=>{ if(e.target.matches && e.target.matches('details[data-act=selOpen]')){ UI.selOpen=e.target.open; saveUI(); } if(e.target.matches && e.target.matches('details[data-act=pgOpen]')){ UI.pgOpen=e.target.open; saveUI(); } }, true);
document.addEventListener('click', e=>{
  const n=e.target.closest('[data-nav]'); if(n){ e.preventDefault(); closeModal(); UI.search=''; return go(n.dataset.nav); }
  const a=e.target.closest('[data-act]'); if(!a) return;

    case 'theme': { const cur=document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nx; try{localStorage.setItem(STORE_KEY+'-theme',nx);}catch(e){} break; }

    case 'clearPartie': if(confirm(`Effacer toutes les notes de « ${S.parties[UI.pi].nom} » ?`)){ S.parties[UI.pi].s={}; save(); render(); } break;

    case 'assignRange': { const fr=parseInt(document.getElementById('arFrom').value,10), to=parseInt(document.getElementById('arTo').value,10), g=document.getElementById('arGrp').value; if(!fr||!to||fr>to||to>S.cfg.nbParties){ toast(`Indiquez des numéros de partie entre 1 et ${S.cfg.nbParties}`); break; } for(let i=fr-1;i<to;i++) S.parties[i].g=g; save(); render(); toast(`Parties ${fr} à ${to} rattachées à « ${groupeById(g).nom} »`); break; }
    case 'clsTab': UI.clsTab=v; saveUI(); render(); break;

    case 'setSel': { const id=a.dataset.id; S.sel[id]= S.sel[id]===v ? '' : v; save(); render(); break; }
    case 'clearSel': if(confirm('Effacer tous les statuts de sélection ?')){ S.sel={}; save(); render(); } break;
    case 'autoSel': if(!Object.values(S.sel).some(Boolean) || confirm('Remplacer les statuts actuels par la proposition automatique ?')) autoSelect(); break;
    case 'exportTable': if(LAST_TABLE) download(`${LAST_TABLE.name}_${fileStamp()}.csv`, csv(LAST_TABLE.rows), 'text/csv;charset=utf-8'); break;
    case 'exportJSON': download(`suivi_detection_${fileStamp()}_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,1), 'application/json'); break;

    case 'razNotes': if(confirm('Effacer toutes les notes (parties, ateliers, combiné, tir de précision) en conservant les joueurs ?')){ S.parties.forEach(p=>p.s={}); SESS_KINDS.forEach(k=>S.sessions[k].forEach(x=>x.data={})); S.sel={}; save(); render(); toast('Saisies remises à zéro'); } break;
    case 'reset': if(confirm('Tout effacer, y compris les joueurs ? Pensez à exporter avant.')){ S=defaultState(); save(); go('dash'); } break;
  }
});

/* =====================================================================
   IMPORT CSV D'UNE PARTIE (export boule par boule : une ligne = une boule)
   Colonnes reconnues : partie, date, nom/prénom du joueur, action (Point/Tir), note
   ===================================================================== */
let IMP = null;
const impBtn = () => `<label class="btn pri" data-tip="Un ou plusieurs fichiers CSV boule par boule (colonnes partie, joueur, action, note) — sélection multiple possible">${ICONS.up}Importer le fichier csv d'une partie<input type="file" accept=".csv,text/csv,text/plain" id="importCSV" multiple hidden></label>`;
const normTxt = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();

function parseCSVText(txt){
  txt = txt.replace(/^﻿/,'');
  const first = txt.split(/\r?\n/)[0]||'';
  const sep = [';','\t',','].map(c=>[c, first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"' && f==='') q=true;
    else if(c===sep){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(f); f=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; }
    else f+=c;
  }
  row.push(f); if(row.some(x=>x!=='')) rows.push(row);
  return rows;
}
function impNote(v){
  let s=String(v||'').trim().replace(/^['’`"]+/,'').toUpperCase();
  if(s==='+') return 0;
  if(s==='-'||s==='−'||s==='–') return 8;
  const i='ABCDEFG'.indexOf(s); return (s.length===1&&i>=0) ? i+1 : -1;
}
function impAnalyse(txt, fileName){ return impAnalyseMulti([{txt, name:fileName}]); }
function impAnalyseMulti(files){
  const parts=new Map(), players=new Map(); let ignored=0, total=0; const errors=[];
  files.forEach((f,fi)=>{ try{ impParseOne(f.txt, f.name, fi, parts, players, (i,t)=>{ ignored+=i; total+=t; }); }catch(err){ errors.push(`${f.name} : ${err.message}`); } });
  if(!parts.size) throw new Error(errors.length ? errors.join(' · ') : 'Aucune boule notée lisible');
  return impFinalize(parts, players, ignored, total, files, errors);
}
function impParseOne(txt, fileName, fi, parts, players, count){
  const rows=parseCSVText(txt); if(rows.length<2) throw new Error('Fichier vide');
  const H=rows[0].map(h=>normTxt(h).replace(/ /g,'_'));
  const col=(...res)=>{ for(const re of res){ const i=H.findIndex(h=>re.test(h)); if(i>=0) return i; } return -1; };
  const cPartie=col(/^PARTIE$/,/^PARTIE_NOM$/,/^PARTIE_ID$/), cDate=col(/^DATE$/), cNom=col(/^NOM/,/^JOUEUR_NOM/,/^JOUEUR$/), cPre=col(/^PRENOM/),
        cAct=col(/^ACTION$/,/^GESTE$/,/^TYPE$/,/^ACTION/), cNote=col(/^NOTE$/,/^NOTE/);
  if(cNom<0||cAct<0||cNote<0) throw new Error('Colonnes « nom », « action » ou « note » introuvables');
  let ignored=0, total=0;
  rows.slice(1).forEach(r=>{
    const nom=((r[cNom]||'')+' '+(cPre>=0?(r[cPre]||''):'')).replace(/\s+/g,' ').trim(); if(!nom) return;
    total++;
    const act=normTxt(r[cAct]); const k = act.startsWith('P') ? 'p' : act.startsWith('T') ? 't' : null;
    const n=impNote(r[cNote]);
    if(!k || n<0){ ignored++; return; }
    const pk0=cPartie>=0 ? (r[cPartie]||'Partie importée') : 'Partie importée', pk=fi+'|'+pk0;
    if(!parts.has(pk)) parts.set(pk,{key:pk, file:fileName, nom:(String(pk0).replace(/[_\s]*\d{8}[_\s]*$/,'').replace(/_[A-Z]$/,'').replace(/_/g,' ').trim() || String(pk0)), date:cDate>=0?(r[cDate]||''):'', s:{}, n:0, nP:0, nT:0});
    const P=parts.get(pk), key=normTxt(nom);
    if(!P.s[key]) P.s[key]={p:zeros(9),t:zeros(9)};
    P.s[key][k][n]++; P.n++; k==='p'?P.nP++:P.nT++;
    if(!players.has(key)) players.set(key,{key, nom, n:0, nP:0});
    const pl=players.get(key); pl.n++; if(k==='p') pl.nP++;
  });
  count(ignored, total);
  if(!total) throw new Error('Aucune boule notée lisible');
}
function impFinalize(parts, players, ignored, total, files, errors){
  // date JJ/MM/AAAA → AAAA-MM-JJ
  parts.forEach(P=>{ const m=String(P.date).match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); P.dateISO = m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : (/^\d{4}-\d{2}-\d{2}/.test(P.date)?P.date.slice(0,10):''); });
  const list=[...parts.values()].sort((a,b)=>(a.dateISO||'').localeCompare(b.dateISO||'') || a.nom.localeCompare(b.nom,'fr',{numeric:true}));
  // parties cibles proposées : partie courante si vide, puis parties vides suivantes, sinon nouvelle partie
  const used=new Set(), empty=activeParties().filter(p=>!Object.keys(p.s).length).map(p=>p.idx);
  if(empty.includes(UI.pi)){ empty.splice(empty.indexOf(UI.pi),1); empty.unshift(UI.pi); }
  list.forEach(P=>{ const t=empty.find(i=>!used.has(i)); if(t!=null){ used.add(t); P.target=String(t); } else P.target='new'; });
  // correspondance des joueurs
  const taken=new Set();
  const pls=[...players.values()].sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  pls.forEach(x=>{
    const toks=x.key.split(' ');
    let cand=S.players.filter(p=>{ const k=normTxt(p.nom); return k===x.key || k.split(' ').sort().join(' ')===[...toks].sort().join(' '); });
    if(cand.length!==1) cand=S.players.filter(p=>{ const pt=normTxt(p.nom).split(' '); return toks.every(t=>pt.includes(t)); });
    if(cand.length===1 && !taken.has(cand[0].id)){ x.map=cand[0].id; x.auto=true; taken.add(cand[0].id); }
    else { x.map='new'; x.auto=false; x.ambig=cand.length>1; }
    const share=x.n?x.nP/x.n:0; x.poste = share>=0.7?'P' : share<=0.3?'T' : 'M';
  });
  const fileName = files.length>1 ? `${files.length} fichiers` : files[0].name;
  return {fileName, nbFiles:files.length, errors, parts:list, players:pls, ignored, total, opt:{replace:true, rename:true, bj:true, grp:(S.groupes[S.groupes.length-1]||{}).id}};
}
function impPlayerName(nom){ const t=nom.trim().split(/\s+/); return [t[0].toUpperCase(), ...t.slice(1).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase())].join(' '); }

function impHTML(){

  const errs=impCheck();

  return `<div class="modal-h"><div><h2>Importer les notes d'une partie</h2><div class="small muted">${esc(I.fileName)} · ${I.parts.length} partie${I.parts.length>1?'s':''} détectée${I.parts.length>1?'s':''} · ${I.total-I.ignored} boules notées · ${I.players.length} joueurs${I.ignored?` · <span class="neg">${I.ignored} boule${I.ignored>1?'s':''} sans note lisible ignorée${I.ignored>1?'s':''}</span>`:''}${I.errors&&I.errors.length?`<div class="neg" style="margin-top:4px">Fichier${I.errors.length>1?'s':''} non importé${I.errors.length>1?'s':''} : ${I.errors.map(esc).join(' · ')}</div>`:''}</div></div>
    <div style="margin-left:auto"><button class="btn sm ghost" data-act="closemodal">${ICONS.x}</button></div></div>
  <div class="modal-b stack">
    <div class="card" style="box-shadow:none"><div class="card-h"><h3>1. À quelle partie affecter les notes ?</h3></div><div class="tw"><table class="t">
      <thead><tr><th class="l">Partie du fichier</th><th class="l">Date</th><th>Point</th><th>Tir</th><th>Joueurs</th><th class="l">Affecter à</th></tr></thead>
      <tbody>${I.parts.map((P,i)=>{ const tg=P.target!==''&&P.target!=='new'?S.parties[+P.target]:null; return `<tr><td class="l"><b>${esc(P.nom)}</b>${I.nbFiles>1?`<div class="small muted">${esc(P.file)}</div>`:''}</td><td class="l">${esc(P.date)}</td><td>${P.nP}</td><td>${P.nT}</td><td>${Object.keys(P.s).length}</td>
        <td class="l"><select class="inp" data-impt="${i}" style="min-width:230px">${tOpts(P.target)}</select>${tg&&Object.keys(tg.s).length?`<div class="small" style="color:var(--warn-ink);margin-top:3px">⚠ cette partie contient déjà des notes</div>`:''}</td></tr>`; }).join('')}</tbody></table></div>
      ${nbNew&&S.groupes.length>1?`<div class="card-b row small">Regroupement des nouvelles parties : <select class="inp" data-impo="grp" style="width:auto">${S.groupes.map(g=>`<option value="${g.id}" ${I.opt.grp===g.id?'selected':''}>${esc(g.nom)}</option>`).join('')}</select></div>`:''}
    </div>
    <div class="card" style="box-shadow:none"><div class="card-h"><h3>2. Correspondance des joueurs</h3><span class="hint">reconnaissance automatique par le nom, à vérifier</span></div><div class="tw"><table class="t">
      <thead><tr><th class="l">Nom dans le fichier</th><th>Boules</th><th>% point</th><th class="l">Joueur de l'application</th><th class="l"></th></tr></thead>
      <tbody>${I.players.map((x,i)=>`<tr><td class="l"><b>${esc(x.nom)}</b></td><td>${x.n}</td><td>${f0(x.nP/x.n*100)}</td><td class="l"><select class="inp" data-impp="${i}" style="min-width:260px">${pOpts(x)}</select></td>
        <td class="l small">${x.map===''?'<span class="muted">ignoré</span>':x.map==='new'?(x.ambig?'<span style="color:var(--warn-ink)">⚠ plusieurs joueurs possibles</span>':'<span class="muted">sera créé</span>'):''}${x.map&&x.map!=='new'?(x.auto?'<span class="ok-i">✓ reconnu</span>':'<span class="muted">choisi</span>'):''}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="stack" style="gap:6px">
      <label class="row small"><input type="checkbox" data-impo="replace" ${I.opt.replace?'checked':''}>Remplacer les notes déjà saisies de ces joueurs dans la partie cible (sinon elles s'ajoutent)</label>
      <label class="row small"><input type="checkbox" data-impo="rename" ${I.opt.rename?'checked':''}>Reprendre le libellé et la date du fichier pour la partie cible</label>
    </div>
    ${errs.length?`<div class="alert">${errs.map(esc).join('<br>')}</div>`:''}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="closemodal">Annuler</button><button class="btn pri" data-act="impGo" ${errs.length?'disabled style="opacity:.5;cursor:not-allowed"':''}>Importer</button></div>
  </div>`;
}
function impCheck(){
  const I=IMP, errs=[];
  const tg=I.parts.map(P=>P.target).filter(t=>t!==''&&t!=='new');
  if(new Set(tg).size!==tg.length) errs.push('Deux parties du fichier sont affectées à la même partie.');
  const news=I.parts.filter(P=>P.target==='new').length;
  if(S.cfg.nbParties+news>MAXP) errs.push(`Limite de ${MAXP} parties dépassée.`);
  if(!I.parts.some(P=>P.target!=='')) errs.push('Aucune partie à importer.');
  const mp=I.players.map(x=>x.map).filter(m=>m&&m!=='new');
  if(new Set(mp).size!==mp.length) errs.push('Un même joueur de l’application est associé à deux noms du fichier.');
  return errs;
}
function impRefresh(){ const m=document.querySelector('#modal .modal'); if(m) m.innerHTML=impHTML(); }
function impGo(){
  const I=IMP; if(impCheck().length) return;
  // joueurs : création si besoin
  const idOf={};
  I.players.forEach(x=>{
    if(x.map==='new'){ const p={id:uid(), nom:impPlayerName(x.nom), cd:'', annee:'', poste:x.poste, club:''}; S.players.push(p); idOf[x.key]=p.id; }
    else if(x.map) idOf[x.key]=x.map;
  });
  let firstIdx=null, nbB=0, nbP=0;
  I.parts.forEach(P=>{
    if(P.target==='') return;
    let idx;
    if(P.target==='new'){ idx=S.cfg.nbParties; S.cfg.nbParties++; S.parties[idx].s={}; S.parties[idx].g = I.opt.grp || S.parties[Math.max(0,idx-1)].g; }
    else idx=+P.target;
    const pa=S.parties[idx];
    Object.entries(P.s).forEach(([key,r])=>{
      const id=idOf[key]; if(!id) return;
      const cur = (!I.opt.replace && pa.s[id]) ? pa.s[id] : {p:zeros(9),t:zeros(9)};
      pa.s[id]={p:cur.p.map((v,i)=>(+v||0)+r.p[i]), t:cur.t.map((v,i)=>(+v||0)+r.t[i])};
      nbB+=sum(r.p)+sum(r.t);
    });
    if(I.opt.rename){ pa.nom=P.nom; if(P.dateISO) pa.date=P.dateISO; }
    if(firstIdx==null) firstIdx=idx; nbP++;
  });
  save(); closeModal(); IMP=null;
  if(firstIdx!=null) UI.pi=firstIdx; UI.search=''; saveUI(); go('parties');
  toast(`${nbB} boules importées dans ${nbP} partie${nbP>1?'s':''}`);
}
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='importCSV' && t.files && t.files.length){
    const read=file=>new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>{ let txt; try{ txt=new TextDecoder('utf-8',{fatal:true}).decode(fr.result); }catch(err){ txt=new TextDecoder('windows-1252').decode(fr.result); } res({txt, name:file.name}); }; fr.onerror=()=>res({txt:'', name:file.name}); fr.readAsArrayBuffer(file); });
    Promise.all([...t.files].map(read)).then(files=>{
      try{ IMP=impAnalyseMulti(files); openModal(impHTML()); }catch(err){ toast('Import impossible : '+err.message); }
      t.value='';
    });
    return;
  }
  if(!IMP) return;
  const d=t.dataset;
  if(d.impt!==undefined){ IMP.parts[+d.impt].target=t.value; impRefresh(); }
  else if(d.impp!==undefined){ const x=IMP.players[+d.impp]; x.map=t.value; x.auto=false; impRefresh(); }
  else if(d.impo!==undefined){ IMP.opt[d.impo]= t.type==='checkbox' ? t.checked : t.value; impRefresh(); }
});
document.addEventListener('click', e=>{ const a=e.target.closest('[data-act="impGo"]'); if(a && IMP) impGo(); });

/* =====================================================================
   SESSIONS D'ATELIERS, DE COMBINÉ ET DE TIR DE PRÉCISION
   Barre de choix de session (regroupée par regroupement) + gestion
   ===================================================================== */
function sessBar(kind){
  const L=S.sessions[kind], cur=curSess(S,kind), gf=grpFiltre();
  const groups=S.groupes.filter(g=>!gf||g.id===gf);
  const multi=S.groupes.length>1;
  const chip=x=>`<button class="chip ${x.id===cur.id?'on':''}" data-act="setsess" data-kind="${kind}" data-id="${x.id}">${statusDot(moduleStatus(kind,x.data))}${esc(x.nom)}${x.date?`<span class="small" style="opacity:.75">· ${esc(new Date(x.date).toLocaleDateString('fr-FR'))}</span>`:''}</button>`;
  const rows=groups.map(g=>{ const ss=L.filter(x=>x.g===g.id); if(!multi) return `<div class="chips">${ss.map(chip).join('')}</div>`;
    return `<div class="row" style="align-items:center"><span class="small" style="min-width:150px;font-weight:600">${esc(g.nom)}</span><div class="chips">${ss.length?ss.map(chip).join(''):'<span class="small muted">aucune session</span>'}</div></div>`; }).join('');
  return `<div class="stack" style="gap:8px;margin-bottom:16px">${rows}

const T95 = [12.706,4.303,3.182,2.776,2.571,2.447,2.365,2.306,2.262,2.228,2.201,2.179,2.160,2.145,2.131,2.120,2.110,2.101,2.093,2.086,2.080,2.074,2.069,2.064,2.060,2.056,2.052,2.048,2.045,2.042];
function stats(vals){
  const v=vals.filter(x=>x!=null&&!isNaN(x)), n=v.length;
  if(!n) return {n:0};
  const mean=sum(v)/n, sd=n>1?Math.sqrt(sum(v.map(x=>(x-mean)**2))/(n-1)):null;
  const t=n>1?(T95[n-2]||1.96):null, half=sd!=null?t*sd/Math.sqrt(n):null;
  return {n, sum:sum(v), mean, sd, min:Math.min(...v), max:Math.max(...v), lo:half!=null?mean-half:null, hi:half!=null?mean+half:null};
}
function trend(vals){ // régression linéaire sur l'ordre chronologique
  const pts=vals.map((y,x)=>({x,y})).filter(p=>p.y!=null), n=pts.length;
  if(n<3) return null;
  const mx=sum(pts.map(p=>p.x))/n, my=sum(pts.map(p=>p.y))/n;
  const sxx=sum(pts.map(p=>(p.x-mx)**2)), sxy=sum(pts.map(p=>(p.x-mx)*(p.y-my))), syy=sum(pts.map(p=>(p.y-my)**2));
  if(!sxx) return null;
  const a=sxy/sxx, b=my-a*mx, r2=syy?sxy*sxy/(sxx*syy):0;
  return {a, b, r2, at:x=>a*x+b};
}
const dFR = d => d ? new Date(d).toLocaleDateString('fr-FR') : '';
const evDate = (d, g) => d || ((groupeById(g)||{}).date) || '';
function chronoParties(){ return analysisParties().map(p=>({...p, d:evDate(p.date,p.g)})).sort((a,b)=>(a.d||'').localeCompare(b.d||'') || a.idx-b.idx); }
function chronoSessions(kind){ return analysisSessions(kind).map((x,i)=>({x, i, d:evDate(x.date,x.g)})).sort((a,b)=>(a.d||'').localeCompare(b.d||'') || a.i-b.i).map(o=>o.x); }

function seriesFor(pl){
  const d=domaineAuto(pl.poste), out={};
  const parts=chronoParties();
  const gm = pa => { const p=zeros(9),t=zeros(9); Object.values(pa.s).forEach(r=>{r.p.forEach((v,i)=>p[i]+=+v||0); r.t.forEach((v,i)=>t[i]+=+v||0);}); return calcPartie(p,t)[d]; };
  const pr = parts.map(pa=>{ const r=pa.s[pl.id]; const c=r?calcPartie(r.p,r.t)[d]:null; const cnt=r?(d==='point'?r.p:d==='tir'?r.t:r.p.map((v,i)=>(+v||0)+(+r.t[i]||0))):null; return {lab:'P'+(pa.idx+1), full:pa.nom+(pa.d?' · '+dFR(pa.d):''), c:c&&c.n?c:null, reu:c&&c.n?(cnt[0]+cnt[1]+cnt[2]+cnt[3])/c.n*100:null, g:gm(pa)}; }).filter(e=>e.c);
  out.pI={lab:pr.map(e=>e.lab), full:pr.map(e=>e.full), v:pr.map(e=>e.c.I), g:pr.map(e=>e.g.n?e.g.I:null)};
  out.pV={lab:pr.map(e=>e.lab), full:pr.map(e=>e.full), v:pr.map(e=>e.c.V), g:pr.map(e=>e.g.n?e.g.V:null)};
  out.pE={lab:pr.map(e=>e.lab), full:pr.map(e=>e.full), v:pr.map(e=>e.c.E), g:pr.map(e=>e.g.n?e.g.E:null)};
  out.pR={lab:pr.map(e=>e.lab), full:pr.map(e=>e.full), v:pr.map(e=>e.reu), g:pr.map(()=>null)};
  const sess=(kind, getV, ok)=>{ const L=chronoSessions(kind).filter(x=>x.data[pl.id] && ok(x.data[pl.id]));
    const gMean=x=>{ const vs=Object.values(x.data).filter(ok).map(getV); return vs.length?sum(vs)/vs.length:null; };
    return {lab:L.map((x,i)=>'S'+(chronoSessions(kind).indexOf(x)+1)), full:L.map(x=>x.nom+(evDate(x.date,x.g)?' · '+dFR(evDate(x.date,x.g)):'')), v:L.map(x=>getV(x.data[pl.id])), g:L.map(gMean)}; };
  const atOk=a=>(sum(a.p)+sum(a.t))>0 && calcAtelier(a)[d].n>0;
  out.aE=sess('ateliers', a=>calcAtelier(a)[d].E, atOk);
  out.aP=sess('ateliers', a=>calcAtelier(a)[d].pts, atOk);
  out.cP=sess('combine', c=>calcCombine(c).total.pct, c=>calcCombine(c).bj>0);
  out.tP=sess('tdp', t=>calcTdp(t).total.pts, t=>calcTdp(t).bj>0);
  return {d, out};
}
const RAP_ROWS = [
  {k:'pE', lab:'Parties · Efficacité'}, {k:'pI', lab:'Parties · Intensité'}, {k:'pV', lab:'Parties · Volume'}, {k:'pR', lab:'Parties · Réussite (+ A B C) %'},
  {k:'aE', lab:'Ateliers · Efficacité'}, {k:'aP', lab:'Ateliers · Points'}, {k:'cP', lab:'Combiné · % points'}, {k:'tP', lab:'Tir de précision · /100'}

function groupSdMedian(key){ // écart-type médian des joueurs : référence de régularité
  const sds=S.players.map(p=>stats(seriesFor(p).out[key].v).sd).filter(x=>x!=null).sort((a,b)=>a-b);
  return sds.length? sds[Math.floor(sds.length/2)] : null;
}
function trendChart(s, opts={}){
  const W=520,H=210,L=36,R=22,T=12,B=26, n=s.v.length;
  if(!n) return `<div class="muted small" style="padding:30px 0;text-align:center">Aucune donnée</div>`;
  const tr=trend(s.v);
  const all=[...s.v,...s.g.filter(x=>x!=null), ...(tr?[tr.at(0),tr.at(n-1)]:[])];
  let mn=Math.min(...all), mx=Math.max(...all); const pad=(mx-mn)*.12||5; mn=Math.floor((mn-pad)/10)*10; mx=Math.ceil((mx+pad)/10)*10; if(mn>0&&opts.zero) mn=0;
  const x=i=> n<=1?(L+W-R)/2 : L+i*(W-L-R)/(n-1), y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  const step=Math.max(5,Math.ceil((mx-mn)/5/5)*5), ticks=[]; for(let v=Math.ceil(mn/step)*step; v<=mx; v+=step) ticks.push(v);
  const path=a=>{ let d='',pen=false; a.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); pen=true; }); return d; };
  let g=`<g class="grid">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}</g>`;
  g+=s.lab.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`).join('');
  g+=`<path d="${path(s.g)}" fill="none" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if(tr) g+=`<line x1="${x(0)}" y1="${y(tr.at(0))}" x2="${x(n-1)}" y2="${y(tr.at(n-1))}" stroke="#eb6834" stroke-width="2" stroke-dasharray="7 4"/>`;
  g+=`<path d="${path(s.v)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`+s.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  const bw=n<=1?(W-L-R):(W-L-R)/(n-1);
  g+=s.lab.map((l,i)=>`<rect x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-tip="${esc(`<b>${esc(s.full[i])}</b><br>Joueur : ${f1(s.v[i])}<br>Groupe : ${f1(s.g[i])}`+(tr?`<br>Tendance : ${f1(tr.at(i))}`:''))}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title||'')}">${g}</svg>`;
}
function trendTxt(st, tr, unit){
  if(!tr) return {txt:'données insuffisantes (3 valeurs minimum)', cls:'muted', ico:'·'};
  const tot=tr.a*(st.n-1), nette = tr.r2>=0.25 && Math.abs(tot)>=Math.max(2,(st.sd||0)*0.5);
  if(!nette) return {txt:`stable (${tr.a>=0?'+':''}${f1(tr.a)} ${unit}, R² ${f0(tr.r2*100)} %)`, cls:'muted', ico:'→'};
  return tr.a>0 ? {txt:`en progression (+${f1(tr.a)} ${unit}, R² ${f0(tr.r2*100)} %)`, cls:'ok-i', ico:'↗'} : {txt:`en baisse (${f1(tr.a)} ${unit}, R² ${f0(tr.r2*100)} %)`, cls:'bad-i', ico:'↘'};
}

    const me=pa.s[pid]?calcPartie(pa.s[pid].p,pa.s[pid].t)[dom]:null;
    return {lab:'P'+(pa.idx+1), full:pa.nom+(pa.d?' · '+dFR(pa.d):''), v:me&&me.n?me[m]:null, n:me?me.n:0,
      best:best?best.c[m]:null, bestN:best?name(best.id):'', worst:worst?worst.c[m]:null, worstN:worst?name(worst.id):''};
  }).filter(r=>r.best!=null||r.v!=null);
  // niveau sur l'ensemble de la période (cumul des boules)
  const all=computeAll().rows.map(r=>({id:r.pl.id, nom:r.pl.nom, c:r.P[dom]}));
  const ref=all.filter(x=>x.c.n>=NIV_MIN);
  const me=all.find(x=>x.id===pid);
  const sorted=[...ref].sort((a,b)=>b.c[m]-a.c[m]);
  return {rows, m, me:me&&me.c.n?me.c[m]:null, best:sorted[0]||null, worst:sorted[sorted.length-1]||null,
    rank: me&&me.c.n>=NIV_MIN ? sorted.findIndex(x=>x.id===pid)+1 : null, nb:sorted.length};
}
function niveauChart(D, title, all){
  const W=320,H=200,L=30,R=14,T=10,B=24, n=D.rows.length;
  if(!n) return `<div class="muted small" style="padding:40px 0;text-align:center">Aucune partie</div>`;
  let lo=0, hi=100;
  if(D.m!=='I'){ const vs=(all||[D]).flatMap(X=>X.rows.flatMap(r=>[r.v,r.best,r.worst])).filter(v=>v!=null); /* même échelle pour les 3 graphiques */ lo=Math.min(0,Math.floor(Math.min(...vs)/50)*50); hi=Math.max(50,Math.ceil(Math.max(...vs)/50)*50); }
  const stp=[25,50,100,200].find(k=>(Math.ceil(hi/k)-Math.floor(lo/k))<=5)||200; lo=Math.floor(lo/stp)*stp; hi=Math.ceil(hi/stp)*stp; const ticks=[]; for(let t=lo;t<=hi;t+=stp) ticks.push(t);
  const x=i=> n<=1?(L+W-R)/2 : L+i*(W-L-R)/(n-1), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const path=k=>{ let d='',pen=false; D.rows.forEach((r,i)=>{ const v=r[k]; if(v==null){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); pen=true; }); return d; };
  const band=D.rows.map((r,i)=>r.best!=null?[x(i),y(r.best)]:null).filter(Boolean), bandLo=D.rows.map((r,i)=>r.worst!=null?[x(i),y(r.worst)]:null).filter(Boolean).reverse();
  let g=`<g class="grid">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-5}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}</g>`+(lo<0?`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" class="axis"/>`:'');
  const every=Math.ceil(n/8); g+=D.rows.map((r,i)=>i%every===0||i===n-1?`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${esc(r.lab)}</text>`:'').join('');
  if(band.length>1) g+=`<polygon points="${[...band,...bandLo].map(p=>p.join(',')).join(' ')}" fill="var(--surface-3)" opacity=".7"/>`;
  g+=`<path d="${path('best')}" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/>`;
  g+=`<path d="${path('worst')}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  g+=`<path d="${path('v')}" fill="none" stroke="var(--s1)" stroke-width="2.25" stroke-linejoin="round"/>`;
  g+=D.rows.map((r,i)=>r.v==null?'':`<circle cx="${x(i)}" cy="${y(r.v)}" r="3.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="1.5"/>`).join('');
  const bw=n<=1?(W-L-R):(W-L-R)/(n-1);
  g+=D.rows.map((r,i)=>`<rect x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-tip="${esc(`<b>${esc(r.full)}</b><br>Joueur : ${r.v==null?'non joué':f1(r.v)+' % ('+r.n+' boules)'}<br>Meilleur : ${f1(r.best)} %${r.bestN?' · '+esc(r.bestN):''}<br>Moins bon : ${f1(r.worst)} %${r.worstN?' · '+esc(r.worstN):''}`)}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>`;
}
function niveauHTML(pid){
  const doms=[['point','Point'],['tir','Tir'],['total','Global']];
  const Ds=doms.map(([d])=>niveauData(pid,d));
  const cards=doms.map(([d,t],j)=>{ const D=Ds[j];
    return `<div class="card" style="box-shadow:none"><div class="card-h" style="padding:10px 14px"><h3>${t}</h3><span class="hint" style="margin-left:auto">${D.rank?`rang ${D.rank}/${D.nb}`:''}</span></div>
      <div class="card-b" style="padding:10px 12px 6px">${niveauChart(D, NIV_MET[D.m]+' '+t.toLowerCase(), Ds)}
      <div class="row small" style="justify-content:space-between;margin-top:4px;gap:6px">
        <span data-tip="${NIV_MET[D.m]} cumulée du joueur sur la période"><span style="color:var(--s1)">●</span> <b>${D.me==null?'–':f1(D.me)}</b></span>
        <span class="muted" data-tip="${D.best?esc(D.best.nom):''}">Meilleur ${D.best?f1(D.best.c[D.m]):'–'}</span>
        <span class="muted" data-tip="${D.worst?esc(D.worst.nom):''}">Moins bon ${D.worst?f1(D.worst.c[D.m]):'–'}</span>
      </div></div></div>`; }).join('');
  const m=nivMet();
  return `<div class="niveauBox" data-pid="${pid}"><div class="card" style="box-shadow:none"><div class="card-h"><h3>Courbes de niveau — ${NIV_MET[m].toLowerCase()} par partie (%)</h3>
      <div class="seg noprint">${Object.entries(NIV_MET).map(([k,l])=>`<button class="${m===k?'on':''}" data-act="nivMet" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="legend right"><span><i style="background:var(--s1)"></i>Joueur</span><span><i style="background:var(--ink-2);height:2px"></i>Meilleur</span><span><i style="background:repeating-linear-gradient(90deg,var(--ink-2) 0 4px,transparent 4px 7px);height:2px"></i>Moins bon</span><span><i style="background:var(--surface-3)"></i>Étendue du groupe</span></div></div>
    <div class="card-b grid g3" style="gap:12px">${cards}</div>
    <div class="card-b small muted" style="padding:0 16px 12px">Meilleur et moins bon calculés parmi les joueurs ayant joué au moins ${NIV_MIN} boules dans le domaine lors de la partie. Survolez une partie pour voir les noms.</div></div></div>`;
}
document.addEventListener('click', e=>{ const a=e.target.closest('[data-act="nivMet"]'); if(!a) return; UI.nivMet=a.dataset.v; saveUI(); document.querySelectorAll('.niveauBox').forEach(box=>{ box.outerHTML=niveauHTML(box.dataset.pid); }); });

/* =====================================================================
   TABLEAU DE BORD — bouton « Voir » sur les saisies en erreur
   Ouvre l'écran concerné, sur la bonne session / partie, et met en
   évidence le premier joueur en écart.
   ===================================================================== */
function premierEcart(kind, data){
  const L=sortedPlayers();
  for(const pl of L){
    let n=0, ok=true;
    if(kind==='ateliers'){ const a=data[pl.id]; if(a){ const np=sum(a.p), nt=sum(a.t); n=np+nt; ok=(np===S.cfg.bjAtPoint||!S.cfg.bjAtPoint)&&(nt===S.cfg.bjAtTir||!S.cfg.bjAtTir);} }
    if(kind==='combine'){ n=calcCombine(data[pl.id]).bj; ok=n===S.cfg.bjCombine; }
    if(kind==='tdp'){ n=calcTdp(data[pl.id]).bj; ok=n===S.cfg.bjTdp; }
    if(n && !ok) return pl;
  }
  return null;
}
function voirBtn(c){
  if(c.kind){ const x=S.sessions[c.kind].find(s=>s.id===c.sid); const pl=x?premierEcart(c.kind,x.data):null;
    return `<button class="btn sm" data-act="voirErr" data-kind="${c.kind}" data-id="${c.sid}" data-pid="${pl?pl.id:''}" data-tip="${pl?'Premier écart : '+esc(pl.nom):''}" style="margin-left:8px">Voir</button>`; }
  const m=/data-i="(\d+)"/.exec(c.go||''); if(m) return `<button class="btn sm" data-act="gopartie" data-i="${m[1]}" style="margin-left:8px">Voir</button>`;
  return '';
}
function errVoir(checks){
  const bad=checks.filter(c=>c.st.state==='bad'); if(!bad.length) return '';
  return `<div class="errlist" style="margin-top:8px;display:flex;flex-direction:column;gap:6px">${bad.map(c=>`<div class="row" style="gap:8px"><span>• ${esc(c.lab)} : ${c.st.bad} joueur${c.st.bad>1?'s':''} en écart</span>${voirBtn(c)}</div>`).join('')}</div>`;
}
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-act="voirErr"]'); if(!a) return;
  const kind=a.dataset.kind, pid=a.dataset.pid;
  UI.sess[kind]=a.dataset.id; UI.search=''; saveUI(); go(kind);
  if(pid){ const tr=document.querySelector(`tr[data-id="${pid}"]`); if(tr){ tr.scrollIntoView({block:'center'}); tr.classList.add('flashrow'); const c=tr.querySelector('input.cell'); if(c) c.focus({preventScroll:true}); setTimeout(()=>tr.classList.remove('flashrow'),3000); } }
});

/* =====================================================================
   COPIE AUTONOME AVEC DONNÉES
   « Enregistrer une copie avec les données » produit un fichier HTML unique
   (application + sauvegarde intégrée). À l'ouverture de cette copie, les
   données intégrées sont chargées (avec confirmation si des données existent
   déjà dans ce navigateur). Une même copie n'est proposée qu'une fois.
   ===================================================================== */
const EMBED_ID = 'donnees-integrees';
function exporterCopie(){
  const stamp = Date.now().toString(36);
  const payload = {stamp, date:new Date().toISOString(), titre:S.meta.titre||'', joueurs:S.players.length, data:JSON.parse(JSON.stringify(S))};
  const root = document.documentElement.cloneNode(true);
  root.removeAttribute('data-theme');
  ['side','mnav','main','modal','tip','toast'].forEach(id=>{ const el=root.querySelector('#'+id); if(el){ el.innerHTML=''; el.removeAttribute('style'); el.className = el.className.replace(/\bshow\b/g,'').trim(); } });
  const body=root.querySelector('body'); body.removeAttribute('style');
  const old=root.querySelector('#'+EMBED_ID); if(old) old.remove();
  const sc=document.createElement('script'); sc.type='application/json'; sc.id=EMBED_ID;
  sc.textContent = JSON.stringify(payload).replace(/</g,'\\u003c');
  const main=[...body.querySelectorAll('script')].find(x=>!x.type || x.type==='text/javascript');
  body.insertBefore(sc, main||null); body.insertBefore(document.createTextNode('\n'), main||null);
  const html='<!doctype html>\n'+root.outerHTML;
  const d=new Date().toISOString().slice(0,10);
  download(`suivi_detection_${fileStamp()}_avec_donnees_${d}.html`, html, 'text/html;charset=utf-8');
  toast('Copie avec les données enregistrée');
}
// Chargement des données intégrées à l'ouverture d'une copie (avant le premier affichage)
(function(){
  const el=document.getElementById(EMBED_ID); if(!el) return;
  let p; try{ p=JSON.parse(el.textContent); }catch(e){ return; }
  if(!p || !p.data || !p.data.players) return;
  const K=STORE_KEY+'-copie'; let vu=null; try{ vu=localStorage.getItem(K); }catch(e){}
  if(vu===p.stamp) return; // copie déjà traitée dans ce navigateur
  const quand=new Date(p.date).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
  const vide=!S.players.length;
  const ok = vide || confirm(`Ce fichier contient des données enregistrées le ${quand}\n« ${p.titre} » — ${p.joueurs} joueur(s).\n\nLes charger à la place des données actuellement présentes dans ce navigateur ?\n(Pensez à exporter vos données actuelles avant, si besoin.)`);
  try{ localStorage.setItem(K, p.stamp); }catch(e){}
  if(!ok) return;
  S=merge(defaultState(), p.data); save();
  setTimeout(()=>toast(`Données de la copie chargées (${p.joueurs} joueurs)`), 300);
})();
document.addEventListener('click', e=>{ if(e.target.closest('[data-act="exportCopie"]')) exporterCopie(); });

/* ---------- Démarrage (en dernier : toutes les fonctions et constantes sont alors initialisées) ---------- */
try{ const th=localStorage.getItem(STORE_KEY+'-theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
VIEW = UI.view || 'dash';
render();
